<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<style>
  :root{
    --bg:#fbfaf8; --panel:#ffffff; --ink:#1c1b19; --muted:#6b6862; --line:#e2ded7;
    --accent:#b45309; --accent-soft:#fdf0dd; --dim:#d8d4cc; --good:#3f6212;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16150f; --panel:#1f1e17; --ink:#f0ede6; --muted:#a09a8e; --line:#33312a;
      --accent:#f0a03c; --accent-soft:#2e2313; --dim:#3a3831; --good:#a3c063;
    }
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;
    justify-content:center;padding:6vmin;box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .card{max-width:960px;display:flex;gap:clamp(2rem,6vw,5rem);align-items:center;flex-wrap:wrap}
  .words{flex:1 1 320px}
  h1{font-size:clamp(2.4rem,6.4vw,4.4rem);line-height:1.05;margin:0 0 1.4rem;letter-spacing:-.02em}
  .rule{width:64px;height:3px;background:var(--accent);border-radius:2px;margin:0 0 1.6rem}
  .who{font-size:clamp(.95rem,1.5vw,1.15rem);margin:0 0 .35rem}
  .who span{color:var(--muted)}
  .mail{font-size:clamp(.95rem,1.5vw,1.15rem);margin:0;color:var(--muted)}
  .mail a{color:var(--muted);text-decoration:none}
  .qr{flex:0 0 auto;text-align:center}
  .qr img{display:block;width:clamp(150px,20vw,250px);height:auto;border-radius:8px}
  .qr figcaption{font-size:clamp(.85rem,1.3vw,1rem);color:var(--muted);margin-top:.7rem}
</style>
</head>
<body>
  <div class="card">
    <div class="words">
      <h1>Thank you!</h1>
      <div class="rule"></div>
      <p class="who">Carl Scheffler <span>&nbsp;·&nbsp; GenStream</span></p>
      <p class="mail"><a href="mailto:carl.scheffler@gmail.com">carl.scheffler@gmail.com</a></p>
    </div>
    <figure class="qr">
      <!-- Placeholder. Replace qr-placeholder.png with the generated code; keep the filename
           or update the src here. -->
      <img src="qr-placeholder.png" alt="QR code linking to the interactive slides">
      <figcaption>Interactive slides</figcaption>
    </figure>
  </div>
<script>
// Presentation runner: forward slide keys to the parent deck. Inert when opened on its own.
if (window.parent !== window){
  addEventListener("keydown", e => {
    if (e.key === "PageDown" || e.key === "PageUp"){
      e.preventDefault();
      parent.postMessage({deck: e.key}, "*");
    }
  });
}
</script>
</body>
</html>
