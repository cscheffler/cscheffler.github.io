<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kaleidoscope</title>
<style>
  :root{
    --panel-bg: rgba(16,18,28,0.82);
    --panel-br: rgba(150,170,220,0.14);
    --txt: #e7ecf8;
    --txt-dim: #9aa3bd;
    --accent: #7fb6ff;
    --accent2: #c79bff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#03040a; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt); touch-action:none; }
  #stage{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* Fade-out hint shown until first touch */
  #hint{ position:fixed; left:50%; bottom:14%; transform:translateX(-50%);
    color:var(--txt-dim); font-size:15px; letter-spacing:.04em; pointer-events:none;
    transition:opacity .8s ease; text-shadow:0 1px 12px rgba(0,0,0,.6); }

  /* Gear / toggle button */
  #gear{ position:fixed; top:max(12px,env(safe-area-inset-top)); right:14px; z-index:20;
    width:46px; height:46px; border-radius:50%; border:1px solid var(--panel-br);
    background:var(--panel-bg); color:var(--txt); cursor:pointer;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:grid; place-items:center; transition:transform .25s ease, background .2s; }
  #gear:hover{ background:rgba(28,32,46,0.9); }
  #gear:active{ transform:scale(.92); }
  #gear svg{ width:22px; height:22px; }

  /* Control panel */
  #panel{ position:fixed; z-index:15; color:var(--txt);
    background:var(--panel-bg); border:1px solid var(--panel-br);
    backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3);
    transition:transform .32s cubic-bezier(.22,.8,.32,1), opacity .25s ease; }

  /* Desktop: card under the gear, top-right */
  @media (min-width:641px){
    #panel{ top:max(12px,env(safe-area-inset-top)); right:14px; width:300px;
      max-height:calc(100vh - 24px); overflow-y:auto; padding:54px 18px 18px;
      border-radius:18px; transform-origin:top right; }
    #panel.hidden{ opacity:0; transform:translateY(-8px) scale(.96); pointer-events:none; }
  }
  /* Mobile: bottom sheet sliding up */
  @media (max-width:640px){
    #panel{ left:0; right:0; bottom:0; padding:18px 18px calc(20px + env(safe-area-inset-bottom));
      border-radius:20px 20px 0 0; max-height:78vh; overflow-y:auto; }
    #panel.hidden{ transform:translateY(105%); pointer-events:none; }
    #gear{ top:auto; bottom:calc(16px + env(safe-area-inset-bottom)); }
  }

  .row{ margin:0 0 16px; }
  .row:last-child{ margin-bottom:0; }
  .lbl{ display:flex; justify-content:space-between; align-items:baseline;
    font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--txt-dim);
    margin-bottom:8px; }
  .lbl .val{ color:var(--txt); font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; }
  h1{ font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--txt);
    margin:0 0 18px; font-weight:600; opacity:.85; }

  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:4px;
    border-radius:4px; background:rgba(150,170,220,0.22); outline:none; margin:0; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px;
    border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid #0b0e18;
    box-shadow:0 0 10px rgba(127,182,255,.6); }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid #0b0e18; }
  input[type=range]:disabled{ opacity:.4; }

  /* Toggle switch */
  .switch{ position:relative; display:inline-flex; align-items:center; cursor:pointer; }
  .switch input{ position:absolute; opacity:0; }
  .track{ width:46px; height:26px; border-radius:14px; background:rgba(150,170,220,0.2);
    transition:background .2s; position:relative; }
  .track::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
    border-radius:50%; background:#e7ecf8; transition:transform .2s; }
  .switch input:checked + .track{ background:var(--accent); }
  .switch input:checked + .track::after{ transform:translateX(20px); }
  .toggle-row{ display:flex; justify-content:space-between; align-items:center; }
  .toggle-row .name{ font-size:13.5px; }
  .toggle-row .sub{ font-size:11px; color:var(--txt-dim); }

  /* Segmented control */
  .seg{ display:flex; gap:4px; background:rgba(150,170,220,0.12); padding:4px; border-radius:12px; }
  .seg button{ flex:1; border:0; background:transparent; color:var(--txt-dim); cursor:pointer;
    font-size:12.5px; padding:8px 4px; border-radius:9px; transition:.18s; }
  .seg button.active{ background:var(--accent); color:#08101f; font-weight:600; }

  /* Palette swatches */
  #palette{ display:flex; gap:8px; }
  #palette button{ flex:1; height:30px; border-radius:9px; border:2px solid transparent; cursor:pointer; }
  #palette button.active{ border-color:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.4); }

  .btns{ display:flex; gap:10px; }
  .btns button{ flex:1; padding:11px; border-radius:11px; border:1px solid var(--panel-br);
    background:rgba(150,170,220,0.1); color:var(--txt); font-size:13px; cursor:pointer; transition:.18s; }
  .btns button:hover{ background:rgba(150,170,220,0.2); }
  .btns button:active{ transform:scale(.97); }

  #micNote{ font-size:11.5px; color:#ffb4a8; margin-top:7px; display:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">drag to draw</div>

<button id="gear" aria-label="Toggle controls">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<div id="panel" class="hidden">
  <h1>Kaleidoscope</h1>

  <div class="row">
    <div class="lbl">Fold count <span class="val" id="foldVal">6</span></div>
    <input type="range" id="fold" min="3" max="16" step="1" value="6">
  </div>

  <div class="row toggle-row">
    <div><div class="name">Mirror symmetry</div><div class="sub">pinwheel ↔ snowflake</div></div>
    <label class="switch"><input type="checkbox" id="mirror" checked><span class="track"></span></label>
  </div>

  <div class="row toggle-row">
    <div><div class="name">Persistence</div><div class="sub" id="persistSub">building up</div></div>
    <label class="switch"><input type="checkbox" id="persist" checked><span class="track"></span></label>
  </div>

  <div class="row">
    <div class="lbl">Fade rate <span class="val" id="fadeVal">0.10</span></div>
    <input type="range" id="fade" min="0" max="1" step="0.01" value="0.10">
  </div>

  <div class="row">
    <div class="lbl">Global spin <span class="val" id="spinVal">+0.10</span></div>
    <input type="range" id="spin" min="-1" max="1" step="0.01" value="0.10">
  </div>

  <div class="row">
    <div class="lbl">Brush size <span class="val" id="brushVal">mid</span></div>
    <input type="range" id="brush" min="0" max="1" step="0.01" value="0.25">
  </div>

  <div class="row">
    <div class="lbl">Color mode</div>
    <div class="seg" id="mode">
      <button data-mode="palette" class="active">Palette</button>
      <button data-mode="speed">Speed</button>
      <button data-mode="audio">Audio</button>
    </div>
    <div id="micNote">Mic unavailable — staying on last mode.</div>
  </div>

  <div class="row" id="paletteRow">
    <div class="lbl">Palette</div>
    <div id="palette"></div>
  </div>

  <div class="row">
    <div class="lbl">Blend mode</div>
    <div class="seg" id="blend">
      <button data-blend="lighter" class="active">Glow</button>
      <button data-blend="screen">Soft</button>
    </div>
  </div>

  <div class="row btns">
    <button id="clear">Clear</button>
    <button id="save">Save PNG</button>
  </div>
</div>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const state = {
  folds: 6,
  mirror: true,
  persistent: true,   // toggle; when false we're in "fading" mode
  fade: 0.10,         // 0..1 fade rate (effective only when !persistent)
  spin: 0.10,         // -1..+1 signed speed
  brush: 0.25,        // 0..1 -> base width in px
  colorMode: "palette", // "palette" | "speed" | "audio"
  palette: "aurora",
  blend: "lighter",     // "lighter" (additive glow) | "screen" (softer)
};

// Hue ranges per palette: hue lerps h0->h1 over time so a single drag still
// has gradient life. `spread` adds subtle positional variation.
const PALETTES = {
  aurora:    { h0:165, h1:285, s:85, l:56, spread:16, sw:"linear-gradient(135deg,#27e0d0,#7a5cff)" },
  ember:     { h0:-18, h1:52,  s:92, l:56, spread:12, sw:"linear-gradient(135deg,#ff3b30,#ffcc33)" },
  "mono-gold":{ h0:42, h1:52,  s:88, l:58, spread:6,  sw:"linear-gradient(135deg,#a87b22,#ffe08a)" },
  ocean:     { h0:188, h1:236, s:85, l:56, spread:14, sw:"linear-gradient(135deg,#1ea9ff,#3b5bff)" },
  candy:     { h0:292, h1:196, s:90, l:64, spread:34, sw:"linear-gradient(135deg,#ff5bd1,#5be0ff)" },
};

const MAX_SEGMENTS = 1600;   // ring-buffer cap (bounds memory + per-frame cost)
const MAX_SPEED = 34;        // px/frame that maps to "fastest" (thinnest)
const MAX_DEG_PER_SEC = 22;  // spin=1 -> 22°/s (default 0.15 -> ~3.3°/s, per spec)

// ---------------------------------------------------------------------------
// Canvas setup
// ---------------------------------------------------------------------------
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0, cx = 0, cy = 0, dpr = 1;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener("resize", resize);

// ---------------------------------------------------------------------------
// Stroke data (center-relative segments) + transient effects
// ---------------------------------------------------------------------------
// Each segment: {x0,y0,x1,y1 (relative to center), w, color (hsl string), born}
let segs = [];
const pending = [];   // raw pointer points awaiting processing in the rAF loop
let lastPt = null;    // {x,y,t} previous drawn point in the active stroke
let drawing = false;
let speedSmoothed = 0;

let hasDrawn = false, firstDrawT = 0;
let ripples = [];
let clearing = null;  // timestamp when the clear animation began
let globalAngle = 0;

let autopilot = false;    // idle "screensaver" drawing on its own
let emptySince = null;    // when the canvas last became empty in fade mode, else null
const IDLE_DELAY = 15000; // ms the pattern must be gone before autopilot kicks in

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const now = () => performance.now();

// ---------------------------------------------------------------------------
// Audio-reactive plumbing (created lazily, only when the user picks Audio)
// ---------------------------------------------------------------------------
let audioCtx = null, analyser = null, freqData = null;
let audioReady = false, audioRequested = false;
let audioLevel = 0, audioHue = 200;
let lastNonAudioMode = "palette";

async function enableAudio(){
  if (audioReady || audioRequested) return;
  audioRequested = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    audioReady = true;
    micNote.style.display = "none";
  } catch (e) {
    audioReady = false;
    micNote.style.display = "block";
    setColorMode(lastNonAudioMode, true); // graceful fallback
  } finally {
    audioRequested = false;
  }
}

function updateAudio(){
  if (!audioReady) return;
  analyser.getByteFrequencyData(freqData);
  let sum = 0, max = 0, maxi = 0;
  for (let i = 0; i < freqData.length; i++){
    sum += freqData[i];
    if (freqData[i] > max){ max = freqData[i]; maxi = i; }
  }
  audioLevel = (sum / freqData.length) / 255;            // 0..1 average loudness
  audioHue = (maxi / freqData.length) * 360;             // dominant band -> hue
}

// ---------------------------------------------------------------------------
// Color
// ---------------------------------------------------------------------------
function colorFor(p, speedNorm, t){
  let h, s, l;
  if (state.colorMode === "speed"){
    const ang = Math.atan2(p.y - cy, p.x - cx);
    const posHue = ang / (2 * Math.PI) * 360 + 180;
    const spdHue = (1 - speedNorm) * 250;                // slow=blue, fast=red
    h = posHue * 0.5 + spdHue * 0.5;
    s = 90; l = 50 + speedNorm * 22;
  } else if (state.colorMode === "audio" && audioReady){
    h = audioHue;
    s = 90; l = 45 + audioLevel * 40;
  } else {
    const pal = PALETTES[state.palette];
    const phase = t * 0.00020;
    const k = (Math.sin(phase) + 1) / 2;
    const ang = Math.atan2(p.y - cy, p.x - cx);
    h = pal.h0 + (pal.h1 - pal.h0) * k + Math.sin(ang * 2) * pal.spread;
    s = pal.s; l = pal.l;
  }
  h = ((h % 360) + 360) % 360;
  return "hsl(" + h.toFixed(0) + " " + s.toFixed(0) + "% " + l.toFixed(0) + "%)";
}

const brushPx = () => 2 + state.brush * 16;

// ---------------------------------------------------------------------------
// Input -> segments
// ---------------------------------------------------------------------------
function addPoint(p){
  if (lastPt){
    const dx = p.x - lastPt.x, dy = p.y - lastPt.y;
    const dist = Math.hypot(dx, dy);
    const dt = Math.max(p.t - lastPt.t, 6);
    const speed = dist / dt * 16;                         // ~px per 16ms frame
    speedSmoothed += (speed - speedSmoothed) * 0.35;      // smooth the jitter
    const sn = clamp(speedSmoothed / MAX_SPEED, 0, 1);

    let w = brushPx() * clamp(1.4 - sn * 1.15, 0.25, 1.4); // slow=thick, fast=thin
    if (state.colorMode === "audio" && audioReady) w *= 0.5 + audioLevel * 1.8;

    segs.push({
      x0: lastPt.x - cx, y0: lastPt.y - cy,
      x1: p.x - cx,      y1: p.y - cy,
      w, color: colorFor(p, sn, p.t), born: p.t,
    });
  }
  lastPt = p;
}

function getPos(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top, t: now() };
}

cv.addEventListener("pointerdown", e => {
  autopilot = false;          // any real interaction stops the screensaver
  cv.setPointerCapture(e.pointerId);
  lastPt = getPos(e);
  drawing = true;
  speedSmoothed = 0;
  if (!hasDrawn){ hasDrawn = true; firstDrawT = now(); hint.style.opacity = "0"; }
  if (!reduceMotion) ripples.push({ x: lastPt.x, y: lastPt.y, t: now() });
  e.preventDefault();
});
cv.addEventListener("pointermove", e => {
  if (!drawing) return;
  // Coalesced events give smoother fast strokes where supported.
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) pending.push(getPos(ev));
  e.preventDefault();
});
function endStroke(){ drawing = false; lastPt = null; }
window.addEventListener("pointerup", endStroke);
window.addEventListener("pointercancel", endStroke);

// ---------------------------------------------------------------------------
// Idle autopilot ("screensaver")
// ---------------------------------------------------------------------------
// In fade mode only, once the canvas has stayed empty for IDLE_DELAY, a
// synthetic drifting pointer starts drawing on its own. Any real draw stops it,
// and whatever it made is left on screen for the user to keep adding to, clear,
// or let fade. It never runs in persist mode (so the user's lasting work is
// untouched) or under reduced-motion.
function autoPoint(t){
  // Two incommensurate Lissajous frequencies per axis give a non-repeating,
  // space-filling wander with natural speed variation.
  const R = Math.min(W, H) * 0.42;
  const x = cx + (Math.sin(t * 0.00061) * 0.7 + Math.sin(t * 0.00103 + 2.0) * 0.3) * R;
  const y = cy + (Math.sin(t * 0.00083 + 1.0) * 0.7 + Math.cos(t * 0.00047 + 0.5) * 0.3) * R;
  return { x, y, t };
}
function startAutopilot(t){
  autopilot = true;
  speedSmoothed = 0;
  lastPt = autoPoint(t - 16);   // seed slightly back so the first segment has length
  hint.style.opacity = "0";
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function drawBackground(){
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.72);
  g.addColorStop(0, "#0b0e18");
  g.addColorStop(1, "#03040a");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawGuides(t){
  let ga = hasDrawn ? Math.max(0, 0.45 * (1 - (t - firstDrawT) / 1400)) : 0.45;
  if (ga <= 0) return;
  ctx.save();
  ctx.globalAlpha = ga;
  ctx.strokeStyle = "rgba(150,180,255,0.7)";
  ctx.lineWidth = 1;
  for (const r of [44, 96, 156]){ ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke(); }
  ctx.fillStyle = "rgba(190,205,255,0.9)";
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 7); ctx.fill();
  ctx.restore();
}

function drawRipples(t){
  for (let i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i], p = Math.max(0, (t - r.t) / 700);
    if (p >= 1){ ripples.splice(i, 1); continue; }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = (1 - p) * 0.5;
    ctx.strokeStyle = "rgba(130,175,255,0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, p * 72, 0, 7); ctx.stroke();
    ctx.restore();
  }
}

function render(t){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  drawBackground();
  drawGuides(t);
  if (!reduceMotion) drawRipples(t);

  // Precompute the 2N symmetry copies as {cos, sin, mirror} triples.
  const step = (2 * Math.PI) / state.folds;
  const copies = [];
  for (let i = 0; i < state.folds; i++){
    const a = globalAngle + i * step;
    const ca = Math.cos(a), sa = Math.sin(a);
    copies.push(ca, sa, 1);
    if (state.mirror) copies.push(ca, sa, -1);
  }

  const fade = state.persistent ? 0 : state.fade;
  const rate = fade * 1.5;                                // alpha lost per second

  let clearMul = 1;
  if (clearing){
    const p = (t - clearing) / 600;
    clearMul = Math.max(0, 1 - p);
    if (p >= 1){ segs.length = 0; clearing = null; }
  }

  ctx.globalCompositeOperation = state.blend;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (let k = 0; k < segs.length; k++){
    const sg = segs[k];
    let alpha = 0.92 * clearMul;
    if (fade > 0){
      alpha *= Math.max(0, 1 - (t - sg.born) / 1000 * rate);
      if (alpha <= 0.01) continue;
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = sg.color;
    ctx.lineWidth = sg.w;
    for (let c = 0; c < copies.length; c += 3){
      const ca = copies[c], sa = copies[c + 1], m = copies[c + 2];
      const X0 = cx + ca * sg.x0 - sa * m * sg.y0;
      const Y0 = cy + sa * sg.x0 + ca * m * sg.y0;
      const X1 = cx + ca * sg.x1 - sa * m * sg.y1;
      const Y1 = cy + sa * sg.x1 + ca * m * sg.y1;
      ctx.beginPath();
      ctx.moveTo(X0, Y0);
      ctx.lineTo(X1, Y1);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let lastFrame = now();
function frame(t){
  const dt = t - lastFrame; lastFrame = t;

  if (!reduceMotion){
    globalAngle += state.spin * MAX_DEG_PER_SEC * (Math.PI / 180) * (dt / 1000);
  }
  if (state.colorMode === "audio") updateAudio();

  // Process collected pointer points once per frame (rAF batching).
  for (let i = 0; i < pending.length; i++) addPoint(pending[i]);
  pending.length = 0;

  // Expire fully-faded segments, then enforce the ring-buffer cap.
  const fade = state.persistent ? 0 : state.fade;
  if (fade > 0){
    const rate = fade * 1.5;
    let drop = 0;
    while (drop < segs.length && (t - segs[drop].born) / 1000 * rate >= 1) drop++;
    if (drop) segs.splice(0, drop);
  }
  if (segs.length > MAX_SEGMENTS) segs.splice(0, segs.length - MAX_SEGMENTS);

  // Idle autopilot: fade mode only, after the canvas has been empty IDLE_DELAY.
  if (state.persistent || drawing || reduceMotion){
    emptySince = null;
    autopilot = false;
  } else {
    if (segs.length > 0) emptySince = null;          // a pattern is still showing
    else if (emptySince === null) emptySince = t;    // it just disappeared
    if (!autopilot && emptySince !== null && t - emptySince >= IDLE_DELAY) startAutopilot(t);
  }
  if (autopilot) addPoint(autoPoint(t));

  render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------------
// Controls wiring
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const panel = $("panel"), gear = $("gear"), hint = $("hint"), micNote = $("micNote");

function doClear(){ if (!clearing) clearing = now(); }

function setPersistent(val){
  val = !!val;
  if (state.persistent && !val && segs.length){
    // Entering fade mode: rebase the fade clock so the *oldest* stroke is only
    // now starting to fade, instead of being aged retroactively from when it
    // was first drawn (which would make old strokes vanish instantly). A single
    // fixed offset is added to every stroke's birth time, so they still fade in
    // the order they were drawn — oldest first.
    let oldest = segs[0].born;
    for (let i = 1; i < segs.length; i++) if (segs[i].born < oldest) oldest = segs[i].born;
    const delta = now() - oldest;
    for (let i = 0; i < segs.length; i++) segs[i].born += delta;
  }
  state.persistent = val;
}

function savePNG(){
  cv.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kaleidoscope-" + Date.now() + ".png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

function setColorMode(mode, internal){
  if (mode !== "audio") lastNonAudioMode = mode;
  state.colorMode = mode;
  syncControls();
  if (mode === "audio" && !audioReady && !internal) enableAudio();
}

// Build palette swatches
const paletteEl = $("palette");
for (const name in PALETTES){
  const b = document.createElement("button");
  b.dataset.pal = name;
  b.style.background = PALETTES[name].sw;
  b.title = name;
  b.addEventListener("click", () => { state.palette = name; syncControls(); });
  paletteEl.appendChild(b);
}

function syncControls(){
  $("fold").value = state.folds;        $("foldVal").textContent = state.folds;
  $("mirror").checked = state.mirror;
  $("persist").checked = state.persistent;
  $("persistSub").textContent = state.persistent ? "building up" : "fading";
  $("fade").value = state.fade;         $("fadeVal").textContent = state.fade.toFixed(2);
  $("fade").disabled = state.persistent;
  $("spin").value = state.spin;
  $("spinVal").textContent = (state.spin >= 0 ? "+" : "") + state.spin.toFixed(2);
  $("spin").disabled = reduceMotion;
  $("brush").value = state.brush;
  $("brushVal").textContent = state.brush < 0.33 ? "thin" : state.brush > 0.66 ? "thick" : "mid";
  for (const b of $("mode").children) b.classList.toggle("active", b.dataset.mode === state.colorMode);
  for (const b of $("blend").children) b.classList.toggle("active", b.dataset.blend === state.blend);
  for (const b of paletteEl.children) b.classList.toggle("active", b.dataset.pal === state.palette);
  $("paletteRow").style.display = state.colorMode === "palette" ? "" : "none";
}

$("fold").addEventListener("input", e => { state.folds = +e.target.value; syncControls(); });
$("mirror").addEventListener("change", e => { state.mirror = e.target.checked; });
$("persist").addEventListener("change", e => { setPersistent(e.target.checked); syncControls(); });
$("fade").addEventListener("input", e => { state.fade = +e.target.value; syncControls(); });
$("spin").addEventListener("input", e => { state.spin = +e.target.value; syncControls(); });
$("brush").addEventListener("input", e => { state.brush = +e.target.value; syncControls(); });
for (const b of $("mode").children){
  b.addEventListener("click", () => setColorMode(b.dataset.mode));
}
for (const b of $("blend").children){
  b.addEventListener("click", () => { state.blend = b.dataset.blend; syncControls(); });
}
$("clear").addEventListener("click", doClear);
$("save").addEventListener("click", savePNG);
gear.addEventListener("click", () => panel.classList.toggle("hidden"));

if (reduceMotion) state.spin = 0;
syncControls();

// ---------------------------------------------------------------------------
// Test hook (used by tools/shoot.py and for debugging in the console)
// ---------------------------------------------------------------------------
window.UI = {
  set(o){
    if (o.folds != null)      state.folds = clamp(Math.round(o.folds), 3, 16);
    if (o.mirror != null)     state.mirror = !!o.mirror;
    if (o.persistent != null) setPersistent(o.persistent);
    if (o.fade != null)       state.fade = clamp(+o.fade, 0, 1);
    if (o.spin != null)       state.spin = clamp(+o.spin, -1, 1);
    if (o.brush != null)      state.brush = clamp(+o.brush, 0, 1);
    if (o.palette != null && PALETTES[o.palette]) state.palette = o.palette;
    if (o.blend === "lighter" || o.blend === "screen") state.blend = o.blend;
    if (o.colorMode != null)  setColorMode(o.colorMode);
    syncControls();
    return this.get();
  },
  get(){ return JSON.parse(JSON.stringify(state)); },
  clear(){ doClear(); },
  count(){ return segs.length; },
};
})();
</script>
