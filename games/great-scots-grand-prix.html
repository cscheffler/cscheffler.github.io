<style>

.body{font-family:'VT323',ui-monospace,'Courier New',monospace}

/* title */
#ttl{justify-content:space-between;padding-bottom:calc(var(--u)*7)}
.logo{width:100%;padding:calc(var(--u)*16) 0 calc(var(--u)*16);background:linear-gradient(rgba(26,20,35,.88) 62%,rgba(26,20,35,0))}

#sel{justify-content:center;background:rgba(26,20,35,.45)}
.h{font-size:calc(var(--u)*5);line-height:1.35;margin:0 0 calc(var(--u)*4)}
.grid{display:grid;grid-template-columns:repeat(4,calc(var(--u)*32));gap:calc(var(--u)*2);justify-content:center}
.cell{font:inherit;border:0;margin:0;padding:calc(var(--u)*2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 calc(var(--u)*.5) var(--muted)}

.df{font-size:calc(var(--u)*6.2);line-height:1.05;text-align:left;margin:calc(var(--u)*3) 0 calc(var(--u)*4);min-height:calc(var(--u)*20)}

#pos{font-size:calc(var(--u)*10)}

#time{font-size:calc(var(--u)*5)}
#bar{position:absolute;top:calc(var(--u)*17);left:calc(var(--u)*5);right:calc(var(--u)*9);height:calc(var(--u)*3);background:rgba(26,20,35,.75);box-shadow:0 0 0 calc(var(--u)*.7) #1a1423}

.tick{position:absolute;top:calc(var(--u)*-1);width:calc(var(--u)*.7);height:calc(var(--u)*5);background:rgba(255,255,255,.45)}
.mk{position:absolute;top:0;width:calc(var(--u)*3);height:calc(var(--u)*3);margin-left:calc(var(--u)*-1.5);box-shadow:0 0 0 calc(var(--u)*.5) #1a1423}
.mk.me{top:calc(var(--u)*-1.5);height:calc(var(--u)*6);box-shadow:0 0 0 calc(var(--u)*.7) #fff}
#count{position:absolute;left:0;right:0;top:30%;font-size:calc(var(--u)*16);color:#ffd23f;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #1a1423;text-align:center;opacity:0}
#count.on{opacity:1}
#zone{position:absolute;left:0;right:0;top:48%;text-align:center;opacity:0;transition:opacity .4s}
#zone span{display:inline-block;white-space:pre-line;background:#005eb8;color:#fff;font-size:calc(var(--u)*5.5);padding:calc(var(--u)*3) calc(var(--u)*5) calc(var(--u)*2.5);box-shadow:0 0 0 var(--u) #1a1423}
#zone.on{opacity:1}
#wind{position:absolute;left:0;right:0;top:calc(var(--u)*26);text-align:center;opacity:0}

#wind span{display:inline-flex;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*5);color:#fff;background:rgba(26,20,35,.8);padding:calc(var(--u)*2.5) calc(var(--u)*4) calc(var(--u)*2);box-shadow:inset 0 0 0 calc(var(--u)*.7) #8fd6e0}

#wind.r span::after{border-left:calc(var(--u)*5) solid #8fd6e0}

<body>
<div id="stage">
  <canvas id="game" width="160" height="256" aria-label="Race track"></canvas>

  <div id="hud">
    <div class="top"><div id="pos"></div><div class="tr"><div id="legT"></div><div id="time">0:00.0</div></div></div>
    <div id="bar"></div>
    <div id="count"></div>
    <div id="wind"><span>GUST!</span></div>
    <div id="zone"><span id="zoneT"></span></div>
    <div class="pads"><div class="pad l" id="padL"></div><div class="pad r" id="padR"></div></div>
  </div>

  <div id="ttl" class="ov show">
    <div class="logo">
      <div class="l1">GREAT SCOTS</div>
      <div class="l2">GRAND PRIX</div>
      <div class="l3 body">Race Scotland's finest minds from Loch Lomond to the Royal Mile</div>
    </div>
    <div class="box">
      <button id="start" class="btn">START</button>
      <p id="hint" class="hint body"></p>
      <p id="best" class="best body"></p>
    </div>
  </div>

  <div id="sel" class="ov">
    <div class="box">
      <p class="h">Choose your racer</p>
      <div id="grid" class="grid" role="group" aria-label="Racers"></div>
      <div class="det">
        <canvas id="big" width="22" height="24"></canvas>
        <div><div id="dn" class="dn"></div><div id="dm" class="dm body"></div></div>
      </div>
      <p id="df" class="df body"></p>
      <button id="go" class="btn">RACE!</button>
    </div>
  </div>

  <div id="res" class="ov">
    <div class="box">
      <p id="rt" class="rt"></p>
      <div id="rs" class="dm body"></div>
      <ol id="rl" class="rl body"></ol>
      <p id="rf" class="df body"></p>
      <div class="rowb"><button id="cont" class="btn sm">NEXT LEG</button><button id="again" class="btn sm">RACE AGAIN</button><button id="change" class="btn sm blue">NEW RACER</button></div>
    </div>
  </div>

  <button id="mute" aria-label="Toggle sound">♪</button>
</div>

const HZ={isles:[['sheep',.65],['puddle',.35]],snow:[['reindeer',.55],['ice',.45]],glen:[['sheep',.8],['puddle',.2]],loch:[['puddle',.7],['sheep',.3]],farm:[['bale',.45],['sheep',.35],['puddle',.2]],forth:[['puddle',1]],city:[['haggis',.6],['puddle',.4]]};
const HSPD={sheep:[10,10],reindeer:[14,10],haggis:[24,14],bale:[18,10]};
const flat=h=>h.type==='puddle'||h.type==='ice';
function pick(list,v){for(const [k,p] of list){if((v-=p)<0)return k;}return list[0][0];}
function bestD(a,b,f){let bd=a,bv=-1e9;for(let d=a;d<b;d+=10){const v=f(roadCx(d));if(v>bv){bv=v;bd=d;}}return bd;}

let scenery=[],hazards=[],pickups=[],parts=[];
function buildTrack(seed){
  const R=rng(seed);scenery=[];hazards=[];pickups=[];parts=[];let id=0;
  const za=i=>ZONES[i].a,sp=i=>ZONES[i].b-ZONES[i].a;
  const IL=zi('loch'),IF=zi('farm'),II=zi('isles');
  const marks=[
    {d:bestD(za(II)+sp(II)*.35,za(II)+sp(II)*.85,c=>-c),side:1,type:'callanish',off:16},
    {d:bestD(za(IL)+sp(IL)*.35,za(IL)+sp(IL)*.85,c=>c),side:-1,type:'isle',off:14},
    {d:bestD(za(IL)+sp(IL)*.05,za(IL)+sp(IL)*.25,c=>c),side:-1,type:'steamer',off:20},
    {d:BUMPS[0].d,side:-1,type:'crag',off:10},
    {d:BUMPS[1].d,side:1,type:'monument',off:14}];
  const near=(d,side)=>marks.some(m=>m.side===side&&Math.abs(m.d-d)<70);
  for(let d=-160;d<CITY;d+=12+R()*16){
    const ty=typeAt(d);
    if(ty==='forth'){
      if(R()<.18){const max=roadCx(d)-RW-6-12;if(max>6)scenery.push({d,side:-1,off:6+R()*(max-6),type:'boat',id:id++,flip:R()<.5});}
      if(R()<.12){const max=W-roadCx(d)-RW-12;if(max>40)scenery.push({d,side:1,off:38+R()*(max-40),type:'boat',id:id++,flip:R()<.5});}
      continue;
    }
    for(const side of [-1,1]){
      if((ty==='loch'||ty==='isles')&&side<0)continue;
      if(R()<.55){const type=pick(NATURE[ty],R()),dd=d+R()*8;if(!near(dd,side))scenery.push({d:dd,side,off:13+R()*42,type,id:id++,flip:R()<.5});}
    }
    if((ty==='loch'||ty==='isles')&&R()<.24&&!near(d,-1)){const e=ty==='isles'?18:12,max=roadCx(d)-RW-e-12;if(max>6)scenery.push({d,side:-1,off:e+R()*(max-6),type:R()<.6?'boat':'rock',id:id++,flip:R()<.5});}
  }
  marks.forEach(m=>scenery.push({d:m.d,side:m.side,off:m.off,type:m.type,id:id++}));
  for(let d=ZONES[zi('snow')].a+20;d<ZONES[zi('snow')].b;d+=44)for(const side of [-1,1])scenery.push({d,side,off:1,type:'pole',id:id++});
  const IC=zi('city'),sg={d:bestD(za(IC)+(L-za(IC))*.3,za(IC)+(L-za(IC))*.7,c=>c),side:-1};
  scenery.push({d:sg.d,side:-1,off:11,type:'stgiles',id:id++});
  scenery.push({d:L+105,side:0,off:0,type:'edcastle',id:id++});
  for(const side of [-1,1]){
    for(let d=CITY-40;d<L+100;){
      if(side===sg.side&&d<sg.d+48&&d+56>sg.d-2){d=sg.d+48;continue;}
      const depth=(30+R()*26)|0;const face=['#b89a6a','#a8865a','#c4ab7c','#9c8a74'][(R()*4)|0];const roof=['#4b5263','#565d70','#454a58'][(R()*3)|0];
      scenery.push({d,side,type:'bld',depth,face,faceD:shade(face,.75),roof,roofL:shade(roof,1.18),roofD:shade(roof,.78),id:id++,cp:R()});d+=depth+3;
    }
  }
  for(let d=CITY+20;d<L+100;d+=64)for(const side of [-1,1])scenery.push({d,side,off:3,type:'lamp',id:id++});
  LINES.slice(1).forEach(v=>{scenery.push({d:v-6,side:-1,off:1,type:'piper',id:id++});scenery.push({d:v-6,side:1,off:1,type:'piper',id:id++,flip:true});});
  scenery.sort((a,b)=>b.d-a.d);
  for(let d=330;d<L-160;d+=165+R()*170){
    if(LEGS.some(g=>g.a>0&&d>g.a-60&&d<g.a+260))continue;
    const type=pick(HZ[typeAt(d)],R());
    if(flat({type}))hazards.push({id:id++,d,type,x:(R()*2-1)*(RW-10),vx:0,hit:false});
    else{const sgn=R()<.5?-1:1,[b,v]=HSPD[type];hazards.push({id:id++,d,type,x:sgn*(RW+4+R()*10),vx:-sgn*(b+R()*v),hit:false});}
  }
  for(let d=260;d<L-120;d+=250+R()*200)pickups.push({d,x:(R()*2-1)*(RW-9),taken:false});
}

function updWind(dt){

    if(wind.phase==='calm'){wind.phase='warn';wind.t=.8;wind.dir=Math.random()<.5?-1:1;}
    else if(wind.phase==='warn'){wind.phase='gust';wind.t=1.2+Math.random()*1.2;wind.peak=45+Math.random()*30;if(player&&typeAt(player.d)==='isles')sfx.gust();}

function ainit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
    eng=AC.createOscillator();eng.type='sawtooth';const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;engG=AC.createGain();engG.gain.value=0;
    eng.connect(lp);lp.connect(engG);engG.connect(master);eng.start();
  }catch(e){AC=null;}
}
function tone(f,dur,type='square',vol=.1,f2=0,delay=0){
  if(!AC)return;const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol=.18){
  if(!AC)return;const b=AC.createBuffer(1,(AC.sampleRate*dur)|0,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(master);s.start();
}

  bump:()=>noise(.12,.22),splash:()=>noise(.25,.12),

  squeak:()=>tone(1200,.12,'triangle',.07,700),skid:()=>tone(1500,.2,'triangle',.05,600),grunt:()=>tone(170,.3,'sawtooth',.07,110),gust:()=>noise(1.4,.07),

function steerPlayer(c,dt){
  const tv=[...touches.values()],tl=tv.includes(-1),tr=tv.includes(1);
  $('padL').classList.toggle('on',tl);$('padR').classList.toggle('on',tr);
  const st=(keys.l||tl?-1:0)+(keys.r||tr?1:0);
  c.x+=st*92*dt;
  const slope=(roadCx(c.d+3)-roadCx(c.d-3))/6;c.x-=slope*c.speed*dt*1.5;
  {const [lo,hi]=xLim(c.d);c.x=clamp(c.x,lo,hi);}
}
function steerAI(c,dt){
  if(Math.random()<dt*.2)c.lane=[-24,0,24][(Math.random()*3)|0];
  let want=c.lane;
  for(const h of hazards){
    if(h.hit&&!flat(h))continue;const dd=h.d-c.d;if(dd<=0||dd>75)continue;
    if(hash(c.idx*7919+h.id*131)>c.skill)continue;
    const hx=h.x+h.vx*(dd/Math.max(c.speed,30));if(Math.abs(hx-want)<15)want=hx+(hx>want?-22:22);
  }
  for(const o of cars){if(o===c)continue;const dd=o.d-c.d;if(dd>0&&dd<45&&o.speed<c.speed+5&&Math.abs(o.x-want)<12)want=o.x+(o.x>c.x?-18:18);}
  if(c.greedy>.35&&!c.finished)for(const p of pickups){if(p.taken)continue;const dd=p.d-c.d;if(dd>0&&dd<90&&Math.abs(p.x-c.x)<30){want=p.x;break;}}
  want=clamp(want,-(RW-7),RW-7);const mv=(62+(typeAt(c.d)==='isles'?Math.abs(windNow())*c.skill:0))*dt;c.x+=clamp(want-c.x,-mv,mv);
}
function moveCar(c,dt,demo){
  let target=c.isPlayer?MAXS:c.base,acc=ACC;
  if(c.boost>0){c.boost-=dt;target=c.isPlayer?BOOSTS:c.base*1.42;acc=170;if(Math.random()<.7)parts.push({x:roadCx(c.d)+c.x+(Math.random()*6-3),d:c.d-8,vx:0,vd:-30,life:.3,c:Math.random()<.5?'#ffd23f':'#ff7a1a'});}
  if(!c.isPlayer&&player&&!player.finished&&!demo){const gap=c.d-player.d;if(gap>260)target*=.9;else if(gap<-220)target*=1.08;}
  if(Math.abs(c.x)>RW-3){target=Math.min(target,OFFS);if(c.speed>35&&Math.random()<.5)parts.push({x:roadCx(c.d)+c.x+(Math.random()*8-4),d:c.d-7,vx:(Math.random()-.5)*20,vd:-10,life:.4,c:Math.random()<.5?'#8a7a5a':'#5d7a3a'});}
  if(c.finished){target=0;acc=55;}
  if(c.speed<target)c.speed=Math.min(target,c.speed+acc*dt);else c.speed=Math.max(target,c.speed-(c.finished?Math.max(40,c.speed*c.speed/(2*Math.max(4,finD+95-c.d))):120)*dt);
  c.d+=c.speed*dt;if(c.finished&&c.d>finD+95){c.d=finD+95;c.speed=0;}
  if(c.finished&&c.speed<1.5){c.speed=0;c.boost=0;c.parked=true;}
}
function hitFx(c,kind){

    if(sy-s.height>H)return;

    let y=sy-s.height;if(o.type==='boat')y+=Math.round(Math.sin(t*2+o.id)*.8);
    if(o.type==='edcastle'){ctx.drawImage(s,Math.round(cx-s.width/2),Math.round(y));return;}
    if(o.type==='steamer'){
      const px=Math.round(x+s.width-3),pe=Math.round(cx-RW-4);ctx.fillStyle='#7a5a3a';ctx.fillRect(px,Math.round(sy-6),pe-px,2);ctx.fillStyle='#4a3524';for(let xx=px+1;xx<pe;xx+=4)ctx.fillRect(xx,Math.round(sy-4),1,2);
      for(let k=0;k<3;k++){const ph=(t*.45+k/3)%1,sz=2+((ph*3)|0);ctx.fillStyle='rgba(110,110,120,'+(0.7*(1-ph)).toFixed(2)+')';ctx.fillRect(Math.round(x+16-ph*9-sz/2),Math.round(y-ph*14),sz,sz);}
    }
    if(SHADOWED.has(o.type)){ctx.fillStyle=typeAt(o.d)==='snow'?'rgba(70,90,130,.22)':'rgba(20,15,30,.24)';ctx.fillRect(Math.round(x)+2,Math.round(sy)-2,s.width-2,3);ctx.fillRect(Math.round(x)+4,Math.round(sy)+1,Math.max(s.width-6,1),1);}
    if(o.type==='isle'||o.type==='steamer'){ctx.save();ctx.globalAlpha=.22;const rh=Math.min(10,s.height);for(let k=0;k<rh;k+=2)ctx.drawImage(s,0,s.height-1-k,s.width,1,Math.round(x)+((k>>1)&1),Math.round(sy)+k,s.width,1);ctx.restore();}
    ctx.drawImage(s,Math.round(x),Math.round(y));
    if(o.type==='boat'){const ph=Math.floor(t*3+o.id)&1,wy=Math.round(y+s.height-2);ctx.fillStyle='rgba(235,245,250,.75)';ctx.fillRect(Math.round(x)-1-ph,wy,2,1);ctx.fillRect(Math.round(x)+s.width-1+ph,wy,2,1);ctx.fillStyle='rgba(235,245,250,.35)';ctx.fillRect(Math.round(x)+2,wy+2,s.width-4,1);}
    if(o.type==='piper'){const ph=(t*.6+o.id*.37)%1,nx=Math.round(x+(o.flip?1:s.width-3)+Math.sin(ph*6)*1.5),ny=Math.round(y-2-ph*12);ctx.fillStyle='rgba(255,255,255,'+(0.9*(1-ph)).toFixed(2)+')';ctx.fillRect(nx+1,ny,1,3);ctx.fillRect(nx,ny+2,2,2);ctx.fillRect(nx+2,ny,1,1);}
  }
}
function drawHazards(camI){
  for(const h of hazards){
    const sy=Math.round(PY-(h.d-camI));if(sy<-10||sy>H+10)continue;if(h.hit&&Math.abs(h.x)>RW+80)continue;
    const x=roadCx(h.d)+h.x;
    if(flat(h)){const ice=h.type==='ice';[6,10,12,10,6].forEach((w,k)=>{ctx.fillStyle=ice?(k===1?'#eaf8fe':'#c4e3f0'):(k===1?'#5a93c0':'#3b6f9c');ctx.fillRect(Math.round(x-w/2),sy-2+k,w,1);});ctx.fillStyle=ice?'#fff':'#bfe0f2';ctx.fillRect(Math.round(x-2),sy-1,2,1);continue;}
    const step=Math.floor(t*(h.type==='haggis'?12:8)+h.id)&1;
    const s=h.type==='bale'?SP.baleFr[(((Math.floor(t*12*Math.sign(h.vx||1))+h.id)%4)+4)%4]:HS[h.type][h.vx<0?1:0][h.hit?0:step];
    const hop=h.hit?Math.abs(Math.sin(t*18))*4:(h.type==='haggis'?step:0);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(Math.round(x-s.width/2+1),sy+1,s.width-2,2);
    ctx.drawImage(s,Math.round(x-s.width/2),Math.round(sy-s.height+2-hop));
  }
  for(const p of pickups){
    if(p.taken)continue;const sy=Math.round(PY-(p.d-camI));if(sy<-10||sy>H+10)continue;
    const x=Math.round(roadCx(p.d)+p.x),bob=Math.round(Math.sin(t*5+p.d)*1.5);
    const sw=SP.saltire.width,sh=SP.saltire.height;ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x-6,sy+5,13,2);ctx.drawImage(SP.saltire,x-(sw>>1),sy-(sh>>1)+bob);
    if((Math.floor(t*8+p.d)&3)===0){ctx.fillStyle='#fff';ctx.fillRect(x+7,sy-7+bob,1,1);ctx.fillRect(x+8,sy-6+bob,1,1);ctx.fillRect(x+6,sy-6+bob,1,1);ctx.fillRect(x+7,sy-5+bob,1,1);}
  }
}
function drawCars(camI){
  const list=cars.slice().sort((a,b)=>b.d-a.d);
  for(const c of list){
    const sy=Math.round(PY-(c.d-camI));if(sy<-20||sy>H+20)continue;const x=Math.round(roadCx(c.d)+c.x);
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x-4,sy-5,11,15);
    ctx.drawImage(c.spr,x-5,sy-7);
    if(c.boost>0){const f=(t*30|0)&1;ctx.fillStyle=f?'#ffd23f':'#ff7a1a';ctx.fillRect(x-3,sy+7,2,2+f);ctx.fillRect(x+1,sy+7,2,3-f);}
    if(c===player&&(state==='countdown'||raceT<1.5)&&(Math.floor(t*4)&1)){ctx.fillStyle='#fff';ctx.fillRect(x-2,sy-13,5,1);ctx.fillRect(x-1,sy-12,3,1);ctx.fillRect(x,sy-11,1,1);}
  }
}
function drawGantry(d,camI){
  const sy=Math.round(PY-(d-camI));if(sy<-4||sy>H+34)return;const cx=Math.round(roadCx(d)),l=cx-RW-4,r=cx+RW+2;
  ctx.fillStyle=INK;ctx.fillRect(l-1,sy-28,4,28);ctx.fillRect(r-1,sy-28,4,28);ctx.fillRect(l-1,sy-29,r-l+4,4);
  ctx.fillStyle='#55515e';ctx.fillRect(l,sy-28,2,28);ctx.fillRect(r,sy-28,2,28);ctx.fillRect(l,sy-28,r-l+2,2);
  const f=SP.flag,n=Math.floor((r-l-2)/(f.width+3)),gap=(r-l+2-n*f.width)/(n+1);
  for(let i=0;i<n;i++){const fx=Math.round(l+gap+i*(f.width+gap)),bob=(Math.floor(t*3)+i)&1;ctx.fillStyle='#55515e';ctx.fillRect(fx+2,sy-26,1,1+bob);ctx.fillRect(fx+f.width-3,sy-26,1,1+bob);ctx.drawImage(f,fx,sy-25+bob);}
}
function zoneWeight(type,d){const z=ZONES[zi(type)];return smooth(z.a-150,z.a+60,d)*(1-smooth(z.b-60,z.b+150,d));}
function drawWeather(){
  const rw=zoneWeight('glen',camD),sw=zoneWeight('snow',camD);
  if(rw>0.01){
    ctx.fillStyle='rgba(28,38,60,'+(0.14*rw).toFixed(3)+')';ctx.fillRect(0,0,W,H);
    const n=(70*rw)|0,M=H+12,MX=W+40;
    for(let k=0;k<n;k++){
      const vy=230+hash(k*17+1)*90,x0=hash(k*29+5)*MX,y=((hash(k*13+3)*M+t*vy+camD*.8)%M)-6,x=(((x0-(t*vy+camD*.8)*.22)%MX)+MX)%MX-20;
      ctx.fillStyle=k%3?'rgba(200,216,238,.6)':'rgba(235,242,252,.8)';
      ctx.fillRect(x|0,y|0,1,3);ctx.fillRect((x-1)|0,(y+3)|0,1,3);
    }
    ctx.fillStyle='rgba(200,220,240,.5)';
    for(let k=0;k<(4*rw|0);k++){const x=(Math.random()*W)|0,y=(Math.random()*H)|0;ctx.fillRect(x-1,y,1,1);ctx.fillRect(x+1,y,1,1);ctx.fillRect(x,y-1,1,1);}
  }
  if(sw>0.01){
    ctx.fillStyle='rgba(220,232,245,'+(0.08*sw).toFixed(3)+')';ctx.fillRect(0,0,W,H);
    const n=(42*sw)|0,M=H+8;
    for(let k=0;k<n;k++){
      const vy=16+hash(k*19+2)*22,big=hash(k*7+9)<.3,y=((hash(k*11+4)*M+t*vy+camD*.55)%M)-4;
      const x=(((hash(k*23+6)*W+Math.sin(t*1.3+k)*5+t*6)%W)+W)%W;
      if(big){ctx.fillStyle='rgba(120,140,165,.55)';ctx.fillRect(x|0,(y|0)+2,2,1);}
      ctx.fillStyle=big?'rgba(255,255,255,.95)':'rgba(255,255,255,.75)';
      ctx.fillRect(x|0,y|0,big?2:1,big?2:1);
    }
  }
}
function render(){
  const camI=Math.floor(camD);
  ctx.fillStyle='#1a1423';ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate(Math.round(Math.random()*2-1),Math.round(Math.random()*2-1));
  drawRoad(camI);drawTrain(camI);drawScenery(camI);drawHazards(camI);drawCars(camI);
  for(const p of parts){const y=Math.round(PY-(p.d-camI));ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),y,1,1);}
  for(const v of LINES)drawGantry(v+3,camI);
  ctx.restore();
  drawWeather();
  const ws=windNow();
  if(typeAt(camD)==='isles'&&Math.abs(ws)>12){ctx.fillStyle='rgba(255,255,255,.6)';const n=Math.min(24,(Math.abs(ws)/3)|0),M=W+30;
    for(let k=0;k<n;k++){const yy=(hash(k*31+7)*H)|0,xx=(((hash(k*13+3)*M+t*ws*3)%M)+M)%M-15;ctx.fillRect(xx|0,yy,10,1);ctx.fillRect((xx|0)+(ws>0?3:0),yy+1,7,1);}}
  if(player&&player.boost>0){ctx.fillStyle='rgba(255,255,255,.35)';for(let k=0;k<5;k++)ctx.fillRect((Math.random()*W)|0,(Math.random()*H)|0,1,8);}
}

/* ---------- Layout & theme ---------- */
function fit(){
  const aw=document.body.clientWidth,ah=document.body.clientHeight;const pad=aw>600?24:0;
  let s=Math.min((aw-pad)/W,(ah-pad)/H);if(s>=3)s=Math.floor(s);stage.style.setProperty('--s',Math.max(s,1).toFixed(3));
}
addEventListener('resize',fit);
function tartan(sett){
  const full=sett.concat(sett.slice(1,-1).reverse()),seq=[];full.forEach(([c,n])=>{for(let i=0;i<n;i++)seq.push(c);});
  const N=seq.length,c=mk(N,N),x=c.getContext('2d');
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){x.fillStyle=((i+j)&3)<2?seq[i]:seq[j];x.fillRect(i,j,1,1);}
  return{url:c.toDataURL(),N};
}
const STEWART=[['#b5121b',10],['#1d2b53',5],['#1a1423',1],['#b5121b',2],['#f1ece0',1],['#b5121b',8],['#1f5a2e',6],['#b5121b',2],['#e8b83a',1]];
const WATCH=[['#16213f',10],['#0c0c14',2],['#16213f',2],['#0c0c14',2],['#173d27',10],['#0c0c14',6],['#2a4a8a',1]];
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const attr=document.documentElement.getAttribute('data-theme');const dark=attr?attr==='dark':mq.matches;
  const tt=tartan(dark?WATCH:STEWART);document.body.style.backgroundImage='url('+tt.url+')';document.body.style.backgroundSize=(tt.N*4)+'px '+(tt.N*4)+'px';
}
mq.addEventListener&&mq.addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- Boot ---------- */
applyTheme();fit();updBest();setSel(0);newDemo();
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(!document.hidden){update(dt);render();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
