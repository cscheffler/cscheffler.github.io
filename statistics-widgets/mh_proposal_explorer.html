<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metropolis–Hastings: proposal length scale</title>
<style>
  :root { --ink:#1d1d1f; --ink2:#555; --muted:#8a8a8a; --line:#e2e2de; --bg:#f7f7f4; --panel:#fff; --blue:#1f77b4; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:1560px; margin:0 auto; padding:14px 20px 28px; }
  h1 { font-size:19px; font-weight:600; margin:0 0 10px; }
  h1 span { font-weight:400; color:var(--ink2); font-size:14px; margin-left:8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px 28px; padding:12px 18px; margin-bottom:14px; }
  .eps { display:flex; align-items:center; gap:12px; flex:1 1 520px; }
  .eps .sym { font:italic 26px Georgia,"Times New Roman",serif; }
  input[type=range] { flex:1; min-width:180px; accent-color:var(--ink); height:28px; }
  input[type=number] { font:inherit; padding:4px 6px; border:1px solid #ccc; border-radius:6px; width:86px; font-variant-numeric:tabular-nums; }
  #epsNum { font-size:20px; width:100px; font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; padding:4px 11px; border:1px solid #c9c9c4; background:#fff; border-radius:999px; cursor:pointer; color:var(--ink); }
  button:hover { background:#f0f0ec; }
  .chips button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .stat { display:flex; flex-direction:column; align-items:flex-end; }
  .stat .v { font-size:38px; font-weight:650; line-height:1; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:12px; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; font-size:13px; color:var(--ink2); width:100%; border-top:1px solid var(--line); padding-top:10px; }
  .opts label { display:flex; align-items:center; gap:6px; }
  .opts input[type=number] { width:74px; font-size:13px; }
  .opts .seed { font-variant-numeric:tabular-nums; }
  .main { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,1fr); gap:14px; }
  .pane { padding:10px 12px 8px; position:relative; }
  .stack { position:relative; }
  .stack canvas { position:absolute; left:0; top:0; }
  .legend { display:flex; gap:18px; font-size:13px; color:var(--ink2); padding:4px 0 2px 48px; flex-wrap:wrap; }
  .legend i { display:inline-block; vertical-align:middle; margin-right:6px; }
  .sw-prop { width:22px; height:0; border-top:2px solid #bfbf00; }
  .sw-samp { width:7px; height:7px; border-radius:50%; background:#00bfbf; }
  .sw-start { width:10px; height:10px; position:relative; }
  .sw-start::before,.sw-start::after { content:""; position:absolute; left:4px; top:-1px; width:2px; height:12px; background:#fff; outline:1px solid #222; transform:rotate(45deg); }
  .sw-start::after { transform:rotate(-45deg); }
  .sw-path { width:22px; height:0; border-top:1.5px solid rgba(40,40,40,.7); }
  .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px 12px; }
  .grid4 canvas { display:block; }
  .runs { margin-top:14px; padding:10px 16px 12px; }
  .runs-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .runs-head b { font-size:14px; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:right; font-weight:500; color:var(--ink2); font-size:13px; padding:4px 10px; border-bottom:1px solid var(--line); }
  td { text-align:right; padding:4px 10px; border-bottom:1px solid #f0f0ec; }
  th:first-child, td:first-child { text-align:left; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#f6f6f2; }
  tbody tr.cur { background:#eef4fa; }
  .bar { display:inline-block; height:8px; background:#c8c8c2; border-radius:0 4px 4px 0; vertical-align:middle; margin-left:8px; }
  .empty { color:var(--muted); font-size:13px; padding:6px 0; }
  #tip { position:fixed; pointer-events:none; background:#1d1d1f; color:#fff; font-size:12px; padding:4px 8px; border-radius:5px; display:none; font-variant-numeric:tabular-nums; z-index:10; }
  @media (max-width: 980px) { .main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Metropolis–Hastings: choosing the proposal length scale <span>proposal N(x<sub>t</sub>, ε²I)</span></h1>

  <div class="card controls">
    <div class="eps">
      <span class="sym">ε</span>
      <input id="epsSlider" type="range" min="-2" max="1.5" step="0.005" aria-label="proposal length scale (log scale)">
      <input id="epsNum" type="number" min="0.001" max="100" step="any" aria-label="proposal length scale">
    </div>
    <div class="chips" id="chips"></div>
    <div class="stat"><span class="k">Acceptance rate</span><span class="v" id="accRate">–</span></div>

    <div class="opts">
      <label>usable samples <input id="nSamp" type="number" min="50" max="20000" step="50"></label>
      <label>warm-up <input id="warm" type="number" min="0" max="100000" step="10"></label>
      <label>steps between samples <input id="thin" type="number" min="1" max="500" step="1"></label>
      <label><input id="showPath" type="checkbox"> show full chain path</label>
      <span>|</span>
      <span class="seed">seed <b id="seedLbl"></b></span>
      <button id="newSeed" title="New random start point and random numbers">New seed</button>
      <span id="stepsLbl"></span>
    </div>
  </div>

  <div class="main">
    <div class="card pane">
      <div class="stack" id="postStack">
        <canvas id="postBg"></canvas>
        <canvas id="postFg"></canvas>
      </div>
      <div class="legend">
        <span><i class="sw-prop"></i>proposal (ε and 2ε)</span>
        <span><i class="sw-samp"></i>usable samples</span>
        <span><i class="sw-start"></i>start</span>
        <span id="pathLegend" style="display:none"><i class="sw-path"></i>full chain</span>
      </div>
    </div>
    <div class="card grid4" id="grid4">
      <canvas id="acfMu"></canvas>
      <canvas id="scMu"></canvas>
      <canvas id="acfSig"></canvas>
      <canvas id="scSig"></canvas>
    </div>
  </div>

  <div class="card runs">
    <div class="runs-head"><b>Runs so far</b><button id="clearRuns">Clear</button></div>
    <table>
      <thead><tr><th>ε</th><th>acceptance rate</th><th>lag-1 ACF μ</th><th>lag-1 ACF σ</th><th>seed</th></tr></thead>
      <tbody id="runsBody"></tbody>
    </table>
    <div class="empty" id="runsEmpty">Each ε you settle on is logged here. Click a row to return to it.</div>
  </div>
</div>
<div id="tip"></div>

<script>
// ---------------- Model (same as notebook) ----------------
const DATA = [-4.127935, -2.152332, 3.046302, -10.77442, -6.985155, 5.536106, 1.294746,
  7.638998, -5.650118, -4.478067, -0.4551435, -3.969413, -0.4225518, -2.462094,
  1.886675, 3.095567, 4.310003, 3.305034, 0.8548273, 4.368213];
const MU_R = [-15, 15], SIG_R = [0, 10];
const SQRT2PI = Math.sqrt(2 * Math.PI);
const BG = DATA.map(x => 0.7 * Math.exp(-0.5 * (x / 4) ** 2) / (4 * SQRT2PI));

// log of: Gamma(σ | 2, 1) · N(μ | 0, 5) · Π_i [0.7 N(x_i | 0, 4) + 0.3 N(x_i | μ, σ)]
function logPost(mu, sig) {
  if (!(sig > 0)) return -Infinity;
  let lp = Math.log(sig) - sig - 0.5 * (mu / 5) ** 2 - Math.log(5 * SQRT2PI);
  const inv = 1 / sig, c = 0.3 * inv / SQRT2PI;
  for (let i = 0; i < DATA.length; i++) {
    const z = (DATA[i] - mu) * inv;
    lp += Math.log(BG[i] + c * Math.exp(-0.5 * z * z));
  }
  return lp;
}

// ---------------- RNG ----------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNormal(rand) {
  let spare = null;
  return () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u, v, s;
    do { u = 2 * rand() - 1; v = 2 * rand() - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    const m = Math.sqrt(-2 * Math.log(s) / s);
    spare = v * m; return u * m;
  };
}

// ---------------- Metropolis–Hastings ----------------
// Symmetric proposal, so the Hastings ratio q(x|x')/q(x'|x) = 1.
// With a fixed seed, every ε uses the same start point and the same random numbers.
function runMH(eps, nSamples, warm, thin, seed) {
  const rand = mulberry32(seed), randn = makeNormal(rand);
  const x0 = [MU_R[0] + rand() * (MU_R[1] - MU_R[0]), SIG_R[0] + rand() * (SIG_R[1] - SIG_R[0])];
  const total = warm + (nSamples - 1) * thin + 1;
  const chain = new Float64Array(2 * (total + 1));
  let mu = x0[0], sg = x0[1], lp = logPost(mu, sg), acc = 0;
  chain[0] = mu; chain[1] = sg;
  for (let t = 1; t <= total; t++) {
    const pm = mu + eps * randn(), ps = sg + eps * randn();
    const lpp = logPost(pm, ps);
    const u = rand();
    if (lpp > -Infinity && (lp === -Infinity || Math.log(u) < lpp - lp)) { mu = pm; sg = ps; lp = lpp; acc++; }
    chain[2 * t] = mu; chain[2 * t + 1] = sg;
  }
  const muS = new Float64Array(nSamples), sgS = new Float64Array(nSamples);
  for (let k = 0; k < nSamples; k++) {
    const idx = warm + 1 + k * thin;
    muS[k] = chain[2 * idx]; sgS[k] = chain[2 * idx + 1];
  }
  return { eps, seed, x0, chain, total, mu: muS, sigma: sgS, acceptance: acc / total,
           acfMu: acf(muS, 20), acfSig: acf(sgS, 20) };
}

// Same as matplotlib acorr(normed=True, detrend=constant)
function acf(x, maxLag) {
  const n = x.length; let m = 0;
  for (let i = 0; i < n; i++) m += x[i];
  m /= n;
  const d = new Float64Array(n); let c0 = 0;
  for (let i = 0; i < n; i++) { d[i] = x[i] - m; c0 += d[i] * d[i]; }
  const out = [];
  for (let k = 0; k <= maxLag; k++) {
    let s = 0;
    for (let i = 0; i + k < n; i++) s += d[i] * d[i + k];
    out.push(c0 > 0 ? s / c0 : NaN);
  }
  return out;
}

// ---------------- Drawing helpers ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function sizeCanvas(cv, w, h, dpr = DPR) {
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
const FONT = '12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const TFONT = '600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function niceTicks(lo, hi, target = 5) {
  const span = hi - lo, raw = span / target, p = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(f => f * p).find(s => span / s <= target) || 10 * p;
  const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) t.push(+v.toFixed(10));
  return t;
}
function fmtTick(v) { return Math.abs(v) < 1e-9 ? '0' : (+v.toPrecision(4)).toString(); }
function drawFrame(ctx, b) {
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w, b.h);
}
function axisLabelX(ctx, b, html, sub) { // x_t style label
  ctx.fillStyle = '#333'; ctx.font = 'italic 15px Georgia,serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const y = b.y + b.h + 22;
  if (!sub) { ctx.fillText(html, b.x + b.w / 2, y); return; }
  const w1 = ctx.measureText(html).width; ctx.font = 'italic 11px Georgia,serif'; const w2 = ctx.measureText(sub).width;
  const x0 = b.x + b.w / 2 - (w1 + w2) / 2;
  ctx.textAlign = 'left'; ctx.font = 'italic 15px Georgia,serif'; ctx.fillText(html, x0, y);
  ctx.font = 'italic 11px Georgia,serif'; ctx.fillText(sub, x0 + w1, y + 6);
}
function axisLabelY(ctx, b, main, sub, xoff) {
  ctx.save(); ctx.translate(b.x - xoff, b.y + b.h / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#333'; ctx.textBaseline = 'bottom';
  if (!sub) { ctx.font = FONT; ctx.textAlign = 'center'; ctx.fillText(main, 0, 0); ctx.restore(); return; }
  ctx.font = 'italic 15px Georgia,serif'; const w1 = ctx.measureText(main).width;
  ctx.font = 'italic 11px Georgia,serif'; const w2 = ctx.measureText(sub).width;
  ctx.textAlign = 'left'; ctx.font = 'italic 15px Georgia,serif'; ctx.fillText(main, -(w1 + w2) / 2, 0);
  ctx.font = 'italic 11px Georgia,serif'; ctx.fillText(sub, -(w1 + w2) / 2 + w1, 5);
  ctx.restore();
}

// YlOrRd reversed
const YLORRD = ['#ffffcc', '#ffeda0', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#bd0026', '#800026'].reverse()
  .map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
function cmap(t) {
  t = Math.max(0, Math.min(1, t)) * (YLORRD.length - 1);
  const i = Math.min(Math.floor(t), YLORRD.length - 2), f = t - i, a = YLORRD[i], b = YLORRD[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
const NLEV = 15;

// ---------------- Posterior plot ----------------
const postBg = document.getElementById('postBg'), postFg = document.getElementById('postFg');
let PG = null; // geometry
let LPMAX = null;
function computeMax() {
  let m = -Infinity;
  for (let i = 0; i <= 400; i++) for (let j = 1; j <= 400; j++) {
    const v = logPost(MU_R[0] + 30 * i / 400, 10 * j / 400); if (v > m) m = v;
  }
  return m;
}
function drawPosteriorBg(W, H) {
  const m = { l: 50, r: 14, t: 30, b: 46 };
  const b = { x: m.l, y: m.t, w: W - m.l - m.r, h: H - m.t - m.b };
  PG = { W, H, b, X: mu => b.x + (mu - MU_R[0]) / (MU_R[1] - MU_R[0]) * b.w, Y: s => b.y + (1 - (s - SIG_R[0]) / (SIG_R[1] - SIG_R[0])) * b.h };
  const ctx = sizeCanvas(postBg, W, H);
  sizeCanvas(postFg, W, H);
  document.getElementById('postStack').style.height = H + 'px';
  if (LPMAX === null) LPMAX = computeMax();

  // filled bands, evaluated per device pixel
  const dpr = Math.min(DPR, 1.5);
  const pw = Math.round(b.w * dpr), ph = Math.round(b.h * dpr);
  const off = document.createElement('canvas'); off.width = pw; off.height = ph;
  const octx = off.getContext('2d'); const img = octx.createImageData(pw, ph);
  const colors = []; for (let k = 0; k < NLEV; k++) colors.push(cmap(k / (NLEV - 1)));
  for (let py = 0; py < ph; py++) {
    const s = SIG_R[1] - (py + 0.5) / ph * (SIG_R[1] - SIG_R[0]);
    for (let px = 0; px < pw; px++) {
      const mu = MU_R[0] + (px + 0.5) / pw * (MU_R[1] - MU_R[0]);
      const p = Math.exp(logPost(mu, s) - LPMAX);
      const k = Math.min(NLEV - 1, Math.floor(p * NLEV));
      const c = colors[k], o = 4 * (py * pw + px);
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, b.x, b.y, b.w, b.h);

  // contour lines (marching squares)
  const G = 260, vals = new Float64Array((G + 1) * (G + 1));
  for (let j = 0; j <= G; j++) for (let i = 0; i <= G; i++)
    vals[j * (G + 1) + i] = Math.exp(logPost(MU_R[0] + 30 * i / G, 10 * j / G) - LPMAX);
  const gx = i => b.x + i / G * b.w, gy = j => b.y + (1 - j / G) * b.h;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 0.9; ctx.beginPath();
  for (let L = 1; L < NLEV; L++) {
    const lev = L / NLEV;
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
      const v00 = vals[j * (G + 1) + i], v10 = vals[j * (G + 1) + i + 1], v01 = vals[(j + 1) * (G + 1) + i], v11 = vals[(j + 1) * (G + 1) + i + 1];
      const a00 = v00 > lev, a10 = v10 > lev, a01 = v01 > lev, a11 = v11 > lev;
      if (a00 === a10 && a10 === a01 && a01 === a11) continue;
      const pts = []; // edges: 0 bottom, 1 right, 2 top, 3 left
      if (a00 !== a10) { const f = (lev - v00) / (v10 - v00); pts[0] = [gx(i + f), gy(j)]; }
      if (a10 !== a11) { const f = (lev - v10) / (v11 - v10); pts[1] = [gx(i + 1), gy(j + f)]; }
      if (a01 !== a11) { const f = (lev - v01) / (v11 - v01); pts[2] = [gx(i + f), gy(j + 1)]; }
      if (a00 !== a01) { const f = (lev - v00) / (v01 - v00); pts[3] = [gx(i), gy(j + f)]; }
      const e = [0, 1, 2, 3].filter(k => pts[k]);
      let segs;
      if (e.length === 2) segs = [[e[0], e[1]]];
      else { const ac = (v00 + v10 + v01 + v11) / 4 > lev; segs = (a00 === ac) ? [[0, 1], [2, 3]] : [[0, 3], [1, 2]]; }
      for (const [p, q] of segs) { ctx.moveTo(pts[p][0], pts[p][1]); ctx.lineTo(pts[q][0], pts[q][1]); }
    }
  }
  ctx.stroke(); ctx.restore();

  // axes
  drawFrame(ctx, b);
  ctx.font = FONT; ctx.fillStyle = '#333'; ctx.strokeStyle = '#333';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let v = -15; v <= 15; v += 5) { const x = PG.X(v); ctx.beginPath(); ctx.moveTo(x, b.y + b.h); ctx.lineTo(x, b.y + b.h + 4); ctx.stroke(); ctx.fillText(v, x, b.y + b.h + 6); }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= 10; v += 2) { const y = PG.Y(v); ctx.beginPath(); ctx.moveTo(b.x - 4, y); ctx.lineTo(b.x, y); ctx.stroke(); ctx.fillText(v, b.x - 7, y); }
  ctx.font = 'italic 15px Georgia,serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('μ', b.x + b.w / 2, b.y + b.h + 24);
  ctx.save(); ctx.translate(b.x - 34, b.y + b.h / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'middle'; ctx.fillText('σ', 0, 0); ctx.restore();
  ctx.font = TFONT; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('MCMC samples on unnormalized posterior over μ and σ', b.x + b.w / 2, b.y - 9);
}

function drawPosteriorFg(R) {
  const ctx = postFg.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, PG.W, PG.H);
  const b = PG.b, X = PG.X, Y = PG.Y;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  if (state.showPath) {
    ctx.strokeStyle = 'rgba(30,30,30,0.45)'; ctx.lineWidth = 0.7; ctx.beginPath();
    ctx.moveTo(X(R.chain[0]), Y(R.chain[1]));
    for (let t = 1; t <= R.total; t++) ctx.lineTo(X(R.chain[2 * t]), Y(R.chain[2 * t + 1]));
    ctx.stroke();
  }
  // proposal at (0, 5), drawn in data coordinates as in the notebook
  const rx = R.eps * b.w / (MU_R[1] - MU_R[0]), ry = R.eps * b.h / (SIG_R[1] - SIG_R[0]);
  ctx.strokeStyle = '#bfbf00'; ctx.lineWidth = 2;
  for (const k of [1, 2]) { ctx.beginPath(); ctx.ellipse(X(0), Y(5), k * rx, k * ry, 0, 0, 2 * Math.PI); ctx.stroke(); }
  // samples
  ctx.fillStyle = '#00bfbf';
  for (let k = 0; k < R.mu.length; k++) { ctx.beginPath(); ctx.arc(X(R.mu[k]), Y(R.sigma[k]), 2.3, 0, 2 * Math.PI); ctx.fill(); }
  // start point
  const sx = X(R.x0[0]), sy = Y(R.x0[1]);
  ctx.lineCap = 'round';
  for (const [w, c] of [[4.5, '#222'], [2, '#fff']]) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
    ctx.moveTo(sx - 6, sy - 6); ctx.lineTo(sx + 6, sy + 6); ctx.moveTo(sx + 6, sy - 6); ctx.lineTo(sx - 6, sy + 6); ctx.stroke();
  }
  ctx.restore();
}

// ---------------- ACF + scatter ----------------
const cvAcfMu = document.getElementById('acfMu'), cvAcfSig = document.getElementById('acfSig');
const cvScMu = document.getElementById('scMu'), cvScSig = document.getElementById('scSig');
let CELL = { w: 300, h: 300 };
const acfGeom = new Map();

function drawAcf(cv, r, varName, eps) {
  const W = CELL.w, H = CELL.h, ctx = sizeCanvas(cv, W, H);
  const b = { x: 54, y: 28, w: W - 54 - 10, h: H - 28 - 44 };
  const full = []; for (let k = -20; k <= 20; k++) full.push([k, r[Math.abs(k)]]);
  const finite = full.map(d => d[1]).filter(Number.isFinite);
  const minV = finite.length ? Math.min(...finite) : 0;
  const y0 = Math.min(-0.1, minV - 0.05), y1 = 1.05;
  const X = k => b.x + (k + 22) / 44 * b.w, Y = v => b.y + (1 - (v - y0) / (y1 - y0)) * b.h;
  acfGeom.set(cv, { b, X, full });
  ctx.font = FONT; ctx.fillStyle = '#333'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const v of niceTicks(y0, y1, 6)) { const y = Y(v); ctx.beginPath(); ctx.moveTo(b.x - 4, y); ctx.lineTo(b.x, y); ctx.stroke(); ctx.fillText(v.toFixed(1), b.x - 7, y); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const v of [-20, -10, 0, 10, 20]) { const x = X(v); ctx.beginPath(); ctx.moveTo(x, b.y + b.h); ctx.lineTo(x, b.y + b.h + 4); ctx.stroke(); ctx.fillText(v, x, b.y + b.h + 6); }
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  ctx.strokeStyle = '#1f77b4'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(b.x, Y(0)); ctx.lineTo(b.x + b.w, Y(0)); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath();
  for (const [k, v] of full) if (Number.isFinite(v)) { ctx.moveTo(X(k), Y(0)); ctx.lineTo(X(k), Y(v)); }
  ctx.stroke(); ctx.restore();
  drawFrame(ctx, b);
  axisLabelY(ctx, b, 'correlation', null, 40);
  ctx.font = FONT; ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillText('lag', b.x + b.w / 2, b.y + b.h + 22);
  ctx.font = TFONT; ctx.textBaseline = 'bottom';
  ctx.fillText(`ACF for ${varName} with ε = ${fmtEps(eps)}`, b.x + b.w / 2, b.y - 8);
}

function drawScatter(cv, x, varName) {
  const W = CELL.w, H = CELL.h, ctx = sizeCanvas(cv, W, H);
  const b = { x: 30, y: 28, w: W - 30 - 10, h: H - 28 - 44 };
  let lo = Infinity, hi = -Infinity; for (const v of x) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!(hi > lo)) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  const X = v => b.x + (v - lo) / (hi - lo) * b.w, Y = v => b.y + (1 - (v - lo) / (hi - lo)) * b.h;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  for (let t = 0; t + 1 < x.length; t++) ctx.fillRect(X(x[t]) - 0.8, Y(x[t + 1]) - 0.8, 1.6, 1.6);
  drawFrame(ctx, b);
  ctx.font = FONT; ctx.fillStyle = '#333'; ctx.strokeStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const v of niceTicks(lo, hi, 5)) { const px = X(v); ctx.beginPath(); ctx.moveTo(px, b.y + b.h); ctx.lineTo(px, b.y + b.h + 4); ctx.stroke(); ctx.fillText(fmtTick(v), px, b.y + b.h + 6); }
  axisLabelX(ctx, b, 'x', 't');
  axisLabelY(ctx, b, 'x', 't+1', 8);
  ctx.font = TFONT; ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(`Scatter plot for ${varName}`, b.x + b.w / 2, b.y - 8);
}

// hover on ACF bars
const tip = document.getElementById('tip');
for (const cv of [cvAcfMu, cvAcfSig]) {
  cv.addEventListener('mousemove', e => {
    const g = acfGeom.get(cv); if (!g) return;
    const rect = cv.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (mx < g.b.x || mx > g.b.x + g.b.w || my < g.b.y || my > g.b.y + g.b.h) { tip.style.display = 'none'; return; }
    const k = Math.max(-20, Math.min(20, Math.round((mx - g.b.x) / g.b.w * 44 - 22)));
    const v = g.full[k + 20][1];
    tip.textContent = `lag ${k}: ${Number.isFinite(v) ? v.toFixed(3) : 'n/a'}`;
    tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 28) + 'px';
  });
  cv.addEventListener('mouseleave', () => tip.style.display = 'none');
}

// ---------------- State, controls, runs log ----------------
const state = { eps: 0.5, n: 1000, warm: 100, thin: 20, seed: 20251, showPath: false, R: null };
const runs = [];
const PRESETS = [0.05, 0.2, 0.5, 1, 2, 5, 10, 25];
const slider = document.getElementById('epsSlider'), num = document.getElementById('epsNum');
const chips = document.getElementById('chips');

function fmtEps(e) { return (+e.toPrecision(2)).toString(); }
function snapEps(e) { return +(+e).toPrecision(2); }

PRESETS.forEach(p => {
  const bt = document.createElement('button'); bt.textContent = p; bt.dataset.v = p;
  bt.onclick = () => { setEps(p); commit(); }; chips.appendChild(bt);
});

function syncControls() {
  slider.value = Math.log10(state.eps);
  num.value = state.eps;
  [...chips.children].forEach(b => b.classList.toggle('on', +b.dataset.v === state.eps));
  document.getElementById('nSamp').value = state.n;
  document.getElementById('warm').value = state.warm;
  document.getElementById('thin').value = state.thin;
  document.getElementById('showPath').checked = state.showPath;
  document.getElementById('seedLbl').textContent = state.seed;
  document.getElementById('pathLegend').style.display = state.showPath ? '' : 'none';
}

function run() {
  const R = runMH(state.eps, state.n, state.warm, state.thin, state.seed);
  state.R = R;
  document.getElementById('accRate').textContent = (R.acceptance * 100).toFixed(1) + '%';
  document.getElementById('stepsLbl').textContent = `${R.total.toLocaleString()} M-H steps`;
  drawAll();
}
function drawAll() {
  const R = state.R; if (!R) return;
  drawPosteriorFg(R);
  drawAcf(cvAcfMu, R.acfMu, 'μ', R.eps);
  drawScatter(cvScMu, R.mu, 'μ');
  drawAcf(cvAcfSig, R.acfSig, 'σ', R.eps);
  drawScatter(cvScSig, R.sigma, 'σ');
}
function setEps(e) {
  e = snapEps(Math.max(0.001, Math.min(100, e)));
  if (!Number.isFinite(e) || e <= 0) return;
  state.eps = e; syncControls(); run();
}

function commit() {
  const R = state.R; if (!R) return;
  const key = `${R.eps}|${R.seed}|${state.n}|${state.warm}|${state.thin}`;
  const existing = runs.findIndex(r => r.key === key);
  if (existing >= 0) runs.splice(existing, 1);
  runs.unshift({ key, eps: R.eps, seed: R.seed, n: state.n, warm: state.warm, thin: state.thin,
                 acc: R.acceptance, r1mu: R.acfMu[1], r1sig: R.acfSig[1] });
  if (runs.length > 14) runs.pop();
  renderRuns();
}
function renderRuns() {
  const body = document.getElementById('runsBody'); body.innerHTML = '';
  document.getElementById('runsEmpty').style.display = runs.length ? 'none' : '';
  const curKey = state.R ? `${state.R.eps}|${state.R.seed}|${state.n}|${state.warm}|${state.thin}` : '';
  const sorted = [...runs].sort((a, b) => a.eps - b.eps || a.seed - b.seed);
  for (const r of sorted) {
    const tr = document.createElement('tr'); if (r.key === curKey) tr.className = 'cur';
    const bar = v => `<span class="bar" style="width:${Math.max(0, Math.min(1, Math.abs(v))) * 70}px"></span>`;
    const f = v => Number.isFinite(v) ? v.toFixed(2) : 'n/a';
    tr.innerHTML = `<td><b>${fmtEps(r.eps)}</b></td><td>${(r.acc * 100).toFixed(1)}%${bar(r.acc)}</td>` +
      `<td>${f(r.r1mu)}${bar(r.r1mu)}</td><td>${f(r.r1sig)}${bar(r.r1sig)}</td><td style="color:#888">${r.seed}</td>`;
    tr.onclick = () => { state.seed = r.seed; state.n = r.n; state.warm = r.warm; state.thin = r.thin; setEps(r.eps); renderRuns(); };
    body.appendChild(tr);
  }
}

slider.addEventListener('input', () => setEps(10 ** +slider.value));
slider.addEventListener('change', () => { commit(); });
num.addEventListener('change', () => { setEps(+num.value); commit(); });
function intInput(id, key, lo, hi) {
  document.getElementById(id).addEventListener('change', e => {
    let v = Math.round(+e.target.value); if (!Number.isFinite(v)) v = state[key];
    state[key] = Math.max(lo, Math.min(hi, v)); syncControls(); run(); commit();
  });
}
intInput('nSamp', 'n', 50, 20000); intInput('warm', 'warm', 0, 100000); intInput('thin', 'thin', 1, 500);
document.getElementById('showPath').addEventListener('change', e => { state.showPath = e.target.checked; syncControls(); drawPosteriorFg(state.R); });
document.getElementById('newSeed').onclick = () => { state.seed = Math.floor(Math.random() * 99999) + 1; syncControls(); run(); commit(); };
document.getElementById('clearRuns').onclick = () => { runs.length = 0; renderRuns(); };

// ---------------- Layout ----------------
function layout() {
  const pane = document.querySelector('.pane'), grid = document.getElementById('grid4');
  const W = Math.floor(pane.clientWidth - 24);
  const H = Math.floor(Math.min(W * 0.9, window.innerHeight - 230 > 420 ? window.innerHeight - 230 : W * 0.9));
  drawPosteriorBg(W, H);
  const gw = grid.clientWidth - 24;
  const cw = Math.floor((gw - 6) / 2);
  const stacked = window.matchMedia('(max-width: 980px)').matches;
  const totalH = H + 30; // align with the posterior pane incl. legend
  CELL = { w: cw, h: stacked ? Math.floor(cw * 0.95) : Math.max(220, Math.floor((totalH - 6) / 2)) };
  drawAll();
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 150); });

syncControls();
state.R = runMH(state.eps, state.n, state.warm, state.thin, state.seed);
layout();
run(); commit();
</script>
</body>
</html>
