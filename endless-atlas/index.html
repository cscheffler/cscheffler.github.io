<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endless Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Press+Start+2P&family=Spectral:ital,wght@0,500;0,700;1,400;1,500&display=swap">
<style>
/* Layout: the map fills the window; a squared-off map-case card sits top-left and a drawer of map styles sits along the bottom. Single dark chrome by choice so every map style reads against it. */
:root{
  --case:#161a21;
  --case-2:#212733;
  --rule:#394150;
  --paper:#efe6d2;
  --muted:#9aa3ae;
  --brass:#d5a74b;
  --brass-ink:#1d1708;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--case);color:var(--paper);font-family:var(--f-ui);font-size:15px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--case)}
#map.dragging{cursor:grabbing}
.panel{position:fixed;background:color-mix(in srgb,var(--case) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:3px;box-shadow:0 6px 24px rgb(0 0 0 / .35)}
.card{top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;max-width:calc(100% - 32px);box-sizing:border-box;padding:10px 14px 11px 14px;display:grid;gap:3px}
.iconbtn{position:absolute;top:7px;right:7px;width:30px;height:30px;display:grid;place-items:center;padding:0;background:transparent;border:1px solid transparent;border-radius:2px;color:var(--muted);cursor:pointer}
.iconbtn:hover{color:var(--paper);background:var(--case-2);border-color:var(--rule)}
.toast input{display:block;width:min(532px,calc(100vw - 60px));box-sizing:border-box;margin-top:6px;font:inherit;font-size:.82rem;padding:5px 7px;background:var(--case-2);color:var(--paper);border:1px solid var(--rule);border-radius:2px}
.toast{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 180px);max-width:min(560px,calc(100% - 32px));padding:10px 14px;font-size:.92rem;line-height:1.35}
.restore{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:38px;height:38px;display:grid;place-items:center;padding:0;color:var(--paper);cursor:pointer;opacity:.72;transition:opacity .15s}
.restore:hover,.restore:focus-visible{opacity:1}
[hidden]{display:none!important}
.card h1{margin:0;padding-right:66px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
.card .sub{color:var(--brass);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.card .world{font-family:var(--f-display);font-style:italic;font-size:.95rem;color:var(--paper);opacity:.85}
.card .ref{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--paper)}
.card .hint{color:var(--muted);font-size:.8rem}
.deck{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin-inline:auto;max-width:1080px;padding:8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.stylepick{position:relative;flex:0 0 auto}
.stylemenu{position:absolute;left:-9px;bottom:calc(100% + 17px);z-index:5;display:grid;gap:4px;padding:8px;min-width:calc(100% + 18px);box-sizing:border-box;background:color-mix(in srgb,var(--case) 96%,transparent)}
.chip.current{grid-template-columns:44px auto 14px}
.chip.current .chev{color:var(--muted);transition:transform .15s}
.chip.current[aria-expanded="true"]{border-color:var(--brass);background:var(--case-2)}
.chip.current[aria-expanded="true"] .chev{transform:rotate(180deg);color:var(--paper)}
.stylemenu .chip{width:100%}
.chip{flex:0 0 auto;display:grid;grid-template-columns:44px auto;align-items:center;gap:9px;padding:5px 12px 5px 5px;border:1px solid var(--rule);border-radius:2px;background:transparent;color:var(--paper);font:inherit;text-align:left;cursor:pointer}
.chip canvas{width:44px;height:44px;image-rendering:pixelated;border-radius:1px;display:block;background:var(--case-2)}
.chip b{display:block;font-weight:600;font-size:.98rem;line-height:1.1}
.chip span{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.chip:hover{background:var(--case-2)}
.chip[aria-pressed="true"]{border-color:var(--brass);background:var(--case-2);box-shadow:inset 0 -2px 0 var(--brass)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.group{display:flex;align-items:center;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.btn{background:transparent;border:0;color:var(--paper);font:inherit;font-weight:600;padding:7px 11px;cursor:pointer;line-height:1.1}
.btn:hover{background:var(--case-2)}
.btn:disabled{color:var(--muted);opacity:.5;cursor:default;background:transparent}
.group .btn+.btn,.group .lbl+.btn,.group .glabel+.btn,.group .btn+input,.group .zoomv+.btn,.group .btn+.zoomv{border-left:1px solid var(--rule)}
.zoomv{min-width:2.3em;text-align:center;font-variant-numeric:tabular-nums;padding:7px 2px;color:var(--muted)}
.glabel{font-weight:600;padding:7px 11px;line-height:1.1;color:var(--paper);user-select:none}
#seed{background:transparent;border:0;color:var(--paper);font:inherit;padding:7px 10px;width:8.5em;min-width:0}
#seed::placeholder{color:var(--muted)}
.voyage[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
label.lbl,span.lbl{color:var(--muted);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding-left:10px}
.group span.lbl{padding-right:10px}
@media (max-width:640px){
  .card h1{font-size:1.05rem}
  .card .hint{display:none}
  .chip{grid-template-columns:36px auto;padding-right:10px}
  .chip canvas{width:36px;height:36px}
  .chip.current{grid-template-columns:36px auto 14px}
}
</style>
</head>
<body>
<canvas id="map" aria-label="Procedurally generated pixel art map. Drag or use arrow keys to explore."></canvas>

<button class="panel restore" id="showUi" aria-label="Show controls" title="Show controls (H)" hidden>
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4l5-2 5 2 5-2v12l-5 2-5-2-5 2z"/><path d="M6.5 2v12M11.5 4v12"/></svg>
</button>

<header class="panel card" id="card">
  <button class="iconbtn" id="copyLink" aria-label="Copy a link to this view" title="Copy a link to this exact view (L)" style="right:40px">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 9.5l3-3"/><path d="M7.5 4.5l1.2-1.2a2.6 2.6 0 013.7 3.7l-1.2 1.2"/><path d="M8.5 11.5l-1.2 1.2a2.6 2.6 0 01-3.7-3.7l1.2-1.2"/></svg>
  </button>
  <button class="iconbtn" id="hideUi" aria-label="Hide controls" title="Hide controls (H)">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v4h4M6 14v-4H2M14.5 1.5L10 6M1.5 14.5L6 10"/></svg>
  </button>
  <h1>Endless Atlas</h1>
  <div class="sub" id="styleSub">Ink on parchment</div>
  <div class="world" id="worldDesc"></div>
  <div class="ref" id="ref">—</div>
  <div class="hint">Drag, scroll or use arrow keys. Ctrl + scroll zooms. A toggles animation, <span id="hintClouds" hidden>C cycles clouds, </span>H hides controls, L copies a link.</div>
</header>

<div class="panel toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="panel deck" id="deck" aria-label="Map controls">
  <div class="stylepick">
    <button class="chip current" id="styleBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="styles" title="Change map style (1–5)">
      <canvas width="30" height="30" id="styleThumb"></canvas>
      <div><b id="styleName"></b><span id="styleDesc"></span></div>
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <div class="panel stylemenu" id="styles" role="group" aria-label="Map style" hidden></div>
  </div>
  <div class="controls">
    <div class="group">
      <label class="lbl" for="seed">World</label>
      <input id="seed" type="text" spellcheck="false" autocomplete="off" placeholder="any word">
      <button class="btn" id="newWorld" title="Pick a random world name">Random</button>
    </div>
    <div class="group" role="group" aria-label="Zoom">
      <span class="glabel">Zoom</span>
      <button class="btn" id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <span class="zoomv" id="zoomVal">3×</span>
      <button class="btn" id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
    </div>
    <div class="group" role="group" aria-label="Voyage" title="Drift across the map on its own; 0× stays put (V pauses and resumes)">
      <span class="glabel">Voyage</span>
      <button class="btn" id="voySlow" aria-label="Slower voyage" title="Slower voyage ([)">−</button>
      <span class="zoomv" id="voySpeed" aria-live="polite">0×</span>
      <button class="btn" id="voyFast" aria-label="Faster voyage" title="Faster voyage (])">+</button>
    </div>
    <div class="group" id="movers" role="group" aria-label="Animation" title="Ships, aircraft, creatures, flashing lights and drifting clouds; off holds the map still (A toggles)">
      <span class="lbl">Animation</span>
      <button class="btn voyage" data-movers="1" aria-pressed="true">On</button>
      <button class="btn voyage" data-movers="0" aria-pressed="false">Off</button>
    </div>
    <div class="group" id="cloudsGroup" role="group" aria-label="Clouds" hidden>
      <span class="lbl">Clouds</span>
      <button class="btn voyage" data-cloud="off" aria-pressed="false" title="No cloud cover (C cycles)">Off</button>
      <button class="btn voyage" data-cloud="simple" aria-pressed="false" title="Clouds drifting on the wind (C cycles)">Drifting</button>
      <button class="btn voyage" data-cloud="living" aria-pressed="true" title="Clouds that form, flow and dissolve, drawn on the graphics card (C cycles)">Living</button>
    </div>
  </div>
</nav>

<script>
/*CORE-START*/
const CH = 64, PAD = 2, P = CH + PAD * 2;
let SEED = 1;
const SEA = 0.5, RIVER_CUT = 0.016, ROAD_BEND = 2;

function hash32(x, y, s) {
  let h = (Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
function strHash(str) { let h = 2166136261; for (let k = 0; k < str.length; k++) h = Math.imul(h ^ str.charCodeAt(k), 16777619); return (h >>> 0) % 1000003; }
function gr(h, x, y) {
  switch (h & 7) { case 0: return x + y; case 1: return y - x; case 2: return x - y; case 3: return -x - y;
    case 4: return x * 1.41; case 5: return -x * 1.41; case 6: return y * 1.41; default: return -y * 1.41; }
}
function noise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const a = gr(hash32(xi, yi, s), xf, yf), b = gr(hash32(xi + 1, yi, s), xf - 1, yf);
  const c = gr(hash32(xi, yi + 1, s), xf, yf - 1), d = gr(hash32(xi + 1, yi + 1, s), xf - 1, yf - 1);
  const ab = a + (b - a) * u, cd = c + (d - c) * u;
  return ab + (cd - ab) * v;
}
function fbm(x, y, s, oct) {
  let a = 1, f = 1, sum = 0, n = 0;
  for (let k = 0; k < oct; k++) { sum += a * noise(x * f, y * f, s + k * 1013); n += a; a *= 0.5; f *= 2.03; }
  return sum / n;
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rgb(r, g, b) { r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g = g < 0 ? 0 : g > 255 ? 255 : g | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0; return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0; }

/* ---------- each world's character ----------
   Every world name sets its own proportions: how much of it is sea, how dry or wet it is, how
   mountainous, how wooded, how many lochs. Values near the middle are as common as before, but
   the draws are pushed toward the ends, so plenty of worlds are clearly one thing or another. */
let WP = { land: 0, wet: 0, peaks: 1, rough: 1, trees: 0, lakes: 0 };
function worldTraits(seed) {
  const u = k => { const v = (hash32(seed, k, 90210) >>> 8) / 0xffffff * 2 - 1; return Math.sign(v) * Math.abs(v) ** 0.7; };   // -1 .. 1, leaning outward
  return { land: 0.11 * u(1), wet: 0.32 * u(2), peaks: 2 ** (1.3 * u(3)), rough: 2 ** (0.35 * u(4)), trees: -0.08 * u(5), lakes: 0.1 * u(6) };
}
/* what a world is actually like: a coarse survey of 900 points over its central 24 km */
function surveyWorld() {
  const c = { sea: 0, lake: 0, mount: 0, forest: 0, desert: 0, n: 0 }, o = {};
  for (let y = -12000; y < 12000; y += 800) for (let x = -12000; x < 12000; x += 800) {
    sample(x + 397, y + 211, o); c.n++;
    if (o.lake > 0.5) c.lake++; else if (o.e < SEA) c.sea++; else if (o.e > 0.72) c.mount++; else if (isForest(o.e, o.m)) c.forest++; else if (o.m < 0.32) c.desert++;
  }
  const land = Math.max(1, c.n - c.sea);
  return { sea: c.sea / c.n, lake: c.lake / land, mount: c.mount / land, forest: c.forest / land, desert: c.desert / land };
}
// medians and quartiles of these shares over 300 worlds; a trait is named when it lies beyond them
const WORLD_NORM = { sea: [0.518, 0.336, 0.666], lake: [0.049, 0.035, 0.066], mount: [0.23, 0.144, 0.319], forest: [0.264, 0.115, 0.403], desert: [0.125, 0.048, 0.338] };
const WORLD_WORDS = { lake: ['lake-strewn', null], mount: ['mountainous', 'low-lying'], forest: ['wooded', 'bare'], desert: ['dry', null] };
function describeWorld(r) {
  const z = k => { const [m, lo, hi] = WORLD_NORM[k]; return r[k] >= m ? (r[k] - m) / (hi - m) : (r[k] - m) / (m - lo); };
  const words = Object.keys(WORLD_WORDS).map(k => ({ v: z(k), w: WORLD_WORDS[k][z(k) > 0 ? 0 : 1] }))
    .filter(x => x.w && Math.abs(x.v) >= 1).sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 2).map(x => x.w);
  const sea = z('sea'), noun = sea >= 1 ? 'ocean world' : sea <= -1 ? 'continental world' : 'world';
  const text = words.length ? words.join(', ') + ' ' + noun : noun === 'world' ? 'temperate world' : noun;
  return (/^[aeiou]/.test(text) ? 'An ' : 'A ') + text;
}
/* ---------- the world: one deterministic sample per cell ---------- */
function sample(x, y, o) {
  const s = SEED;
  const qx = x + 46 * noise(x / 210 + 3.1, y / 210 - 7.7, s + 11);
  const qy = y + 46 * noise(x / 210 - 5.3, y / 210 + 1.9, s + 12);
  const cont = fbm(qx / 560, qy / 560, s + 21, 3);
  const det = fbm(qx / 130, qy / 130, s + 31, 4);
  const rn = 1 - Math.abs(noise(qx / 170, qy / 170, s + 41));
  const base = 0.5 + cont * 0.72 + WP.land;   // the slow rise and fall of the continent; land lifts it all
  let e = base + det * 0.27 * WP.rough;
  const up = e - 0.53;
  if (up > 0) e += rn * rn * rn * up * 0.5 * WP.peaks;
  // Rivers run where rv crosses zero. Rather than ask a river to find a valley, each one carves
  // its own: the land dips in a V toward the line, gently in the lowlands and into a deep glen
  // in the hills, so contours kink upstream where they cross it, as they do on a real map.
  // Near the sea it fades out, so a river never cuts the land through to the sea.
  const rv = noise(qx / 115, qy / 115, s + 61) + 0.25 * noise(qx / 38, qy / 38, s + 62);
  if (e > SEA + 0.01) { const v = 1 - Math.abs(rv) / 0.18; if (v > 0) e -= v * v * clamp01((e - SEA - 0.01) / 0.06) * (RIVER_CUT + 0.35 * Math.max(0, e - 0.56)); }
  const eLand = e;   // the land before lochs are cut (see relief, below)
  // lochs: basins in the lowlands that dip below sea level
  const lk = noise(qx / 95, qy / 95, s + 121) + 0.2 * noise(qx / 30, qy / 30, s + 122);
  o.lake = 0;
  const L0 = 0.36 - WP.lakes;
  if (lk > L0 && e > SEA + 0.02 && e < 0.68) {
    const d = clamp01((lk - L0) / 0.05) * clamp01((0.68 - e) / 0.05) * clamp01((e - SEA - 0.02) / 0.025);
    const target = SEA - 0.008 - (lk - L0) * 0.12;
    if (target < e) e += (target - e) * d;
    o.lake = d;
  }
  o.e = e;
  o.m = 0.5 + fbm(qx / 300, qy / 300, s + 51, 3) * 1.3 + det * 0.25 + WP.wet;
  o.rv = rv;
  o.rm = noise(x / 420, y / 420, s + 71);
  // Roads run where rd crosses zero. Adding the local relief (hills and valleys, without the
  // continent's slow rise) to the road noise makes that line bend to follow the contours wherever
  // the ground is steep, so roads wind around hillsides; on flat land the noise still leads.
  // (the finest ripples of the hills are left out, or every road would wiggle with them)
  const relief = eLand + 0.15 * (e - eLand) - base - 0.27 * WP.rough * (det - noise(qx / 130, qy / 130, s + 31) / 1.875);   // lochs count a little: roads skirt them without ringing them
  o.rd = noise(qx / 380, qy / 380, s + 81) + ROAD_BEND * relief;
  o.rd2 = noise(qx / 120, qy / 120, s + 91) + ROAD_BEND * 1.6 * relief;
  o.rk = noise(x / 330, y / 330, s + 101);
  return o;
}
const PT = {}, CP = {}, TP = {}, XP = {};

function newField(cx, cy) {
  const n = P * P;
  return { cx, cy, e: new Float32Array(n), m: new Float32Array(n), rv: new Float32Array(n), rm: new Float32Array(n), rd: new Float32Array(n), rd2: new Float32Array(n), rk: new Float32Array(n) };
}
function fieldRow(f, y) {
  const x0 = f.cx * CH - PAD, wy = f.cy * CH - PAD + y;
  for (let x = 0, i = y * P; x < P; x++, i++) {
    sample(x0 + x, wy, PT);
    f.e[i] = PT.e; f.m[i] = PT.m; f.rv[i] = PT.rv; f.rm[i] = PT.rm; f.rd[i] = PT.rd; f.rd2[i] = PT.rd2; f.rk[i] = PT.rk;
  }
}
function makeField(cx, cy) { const f = newField(cx, cy); for (let y = 0; y < P; y++) fieldRow(f, y); return f; }
const I = (x, y) => (y + PAD) * P + (x + PAD);
const cross = (a, i, j) => (a[i] > 0) !== (a[j] > 0);
function riverAt(f, x, y) {
  const i = I(x, y), e = f.e[i];
  if (e < SEA || e > 0.66 + 0.12 * f.rm[i]) return 0;
  const rv = f.rv;
  if (cross(rv, i, i + 1) || cross(rv, i, i + P)) return 1;
  if (e < SEA + 0.07 && (cross(rv, i, i - 1) || cross(rv, i, i - P))) return 1;
  return 0;
}
function roadAt(f, x, y) {
  const i = I(x, y), e = f.e[i];
  if (e < SEA + 0.004 || e > 0.70) return 0;
  if (cross(f.rd, i, i + 1) || cross(f.rd, i, i + P)) return 1;
  if (f.rk[i] > 0.05 && e < 0.66 && (cross(f.rd2, i, i + 1) || cross(f.rd2, i, i + P))) return 2;
  return 0;
}
function landNextToWater(f, i) { const e = f.e; return e[i + 1] < SEA || e[i - 1] < SEA || e[i + P] < SEA || e[i - P] < SEA; }
function waterNextToLand(f, i) { const e = f.e; return e[i + 1] >= SEA || e[i - 1] >= SEA || e[i + P] >= SEA || e[i - P] >= SEA; }
const isForest = (e, m) => m > 0.57 + WP.trees && e > SEA + 0.008 && e < 0.69;
const isMarsh = (e, m) => m > 0.67 && e > SEA + 0.004 && e < SEA + 0.05;

/* ---------- sprites ---------- */
function spr(rows) { return { w: rows[0].length, h: rows.length, rows }; }
function stamp(buf, s, px, py, pal) {
  for (let r = 0; r < s.h; r++) {
    const y = py + r; if (y < 0 || y >= CH) continue;
    const row = s.rows[r];
    for (let c = 0; c < s.w; c++) {
      const ch = row[c]; if (ch === '.') continue;
      const x = px + c; if (x < 0 || x >= CH) continue;
      buf[y * CH + x] = pal[ch];
    }
  }
}
function eachCand(x0, y0, S, M, salt, fn) {

/* ================= STYLE 5: Orbital (satellite view) ================= */
const CROPS = [[112, 138, 62], [132, 150, 70], [92, 124, 56], [166, 156, 92], [144, 118, 82], [196, 182, 82], [120, 146, 80], [158, 142, 96]];

  const x0 = f.cx * CH, y0 = f.cy * CH, s = SEED;
  const built = builtMask(x0, y0, [2, 4, 7]);
  for (let y = 0; y < CH; y++) for (let x = 0; x < CH; x++) {
    const i = I(x, y), wx = x0 + x, wy = y0 + y, e = f.e[i], m = f.m[i];
    const hb = hash32(wx, wy, s + 701);
    let r, g, b;

      if (SEA - e < 0.006) { r = 82; g = 168; b = 160; }
      const sw = noise(wx / 3.5, wy / 9, s + 704) * 7;
      r += sw; g += sw; b += sw;
      if (waterNextToLand(f, i) && (hb & 3) === 0) { r = 214; g = 232; b = 226; }
    } else {
      const h = (e - SEA) / (1 - SEA);
      const tex = noise(wx / 4, wy / 4, s + 705) * 0.5 + ((hb & 255) / 255 - 0.5) * 0.5;
      if (e < SEA + 0.004) { r = 210; g = 196; b = 148; }
      else if (isForest(e, m)) {
        const c = noise(wx / 2.2, wy / 2.2, s + 706);

        if (e > 0.62) { r -= 6; g -= 8; }
      } else if (m < 0.36) {

        r = 210 - dn * 52; g = 182 - dn * 50; b = 126 - dn * 40;
      } else if (h < 0.26 && !isMarsh(e, m)) {

        const hedge = ((fy % 9) + 9) % 9 < 1 || ((fx % 13) + 13) % 13 < 1;
        if (hedge && (hb & 3)) { r = 64; g = 86; b = 44; }
        else if (((hash32(col, row, s + 714) >>> 4) & 1) && ((((wx + wy) % 3) + 3) % 3) === 0) { r -= 10; g -= 8; b -= 6; }
      } else if (isMarsh(e, m)) { r = 92; g = 112; b = 78; }

        r = lerp(108, 120, moor); g = lerp(128, 108, moor); b = lerp(70, 76, moor);
        if ((hb & 15) === 0) { r += 18; g -= 6; b += 12; }
      }

      if (h > 0.5) { const sn = (h - 0.58) / 0.07 + noise(wx / 5, wy / 5, s + 713) * 0.5; if (sn > bayer(wx, wy)) { r = 236; g = 238; b = 244; } }

      const sh = Math.max(-0.45, Math.min(0.45, (f.e[i - P - 1] - f.e[i + P + 1]) * 26));
      r *= 1 + sh; g *= 1 + sh; b *= 1 + sh * 0.9;

        const street = ((wx % 4) + 4) % 4 === 0 || ((wy % 4) + 4) % 4 === 0;
        r = street ? 188 : (hb & 1) ? 150 : 124; g = street ? 182 : (hb & 1) ? 142 : 118; b = street ? 170 : (hb & 1) ? 134 : 112;
      }

  }
}

  const n = Math.max(0, Math.min(5, (voyaging ? voySpeed : 0) + d));
  if (n) setVoySpeed(n);
  setVoyage(n > 0);
}
const cardEl = document.getElementById('card'), deckEl = document.getElementById('deck');
const hideBtn = document.getElementById('hideUi'), showBtn = document.getElementById('showUi');
function setUiHidden(h, focus) {
  uiHidden = h;
  cardEl.hidden = h; deckEl.hidden = h; showBtn.hidden = !h;
  if (focus) (h ? showBtn : hideBtn).focus();
  persist();
}
hideBtn.onclick = () => setUiHidden(true, true);
showBtn.onclick = () => setUiHidden(false, true);
document.getElementById('voySlow').onclick = () => stepVoyage(-1);
document.getElementById('voyFast').onclick = () => stepVoyage(1);
const movBtns = [...document.querySelectorAll('[data-movers]')];
function setMovers(on) {
  moversOn = on; frozenT = worldTime();
  for (const b of movBtns) b.setAttribute('aria-pressed', (b.dataset.movers === '1') === on ? 'true' : 'false');
  dirty = true; persist();
}
for (const b of movBtns) b.onclick = () => setMovers(b.dataset.movers === '1');
const cloudBtns = [...document.querySelectorAll('[data-cloud]')], CLOUD_MODES = ['off', 'simple', 'living'];
/* The mode in use is the saved preference, except that Living falls back to Drifting where it
   cannot run. The check runs on the first visit to Orbital, whatever the preference, so the
   Living button is greyed out consistently. */
function applyCloudMode() {
  if (STYLES[styleIdx].id === 'orbital' && GLC.ok === undefined) glInit();
  cloudMode = cloudPref === 'living' && GLC.ok === false ? 'simple' : cloudPref;
  const lb = cloudBtns.find(b => b.dataset.cloud === 'living');
  lb.disabled = GLC.ok === false;
  lb.title = GLC.ok === false ? GLC.reason : 'Clouds that form, flow and dissolve, drawn on the graphics card (C cycles)';
  for (const b of cloudBtns) b.setAttribute('aria-pressed', b.dataset.cloud === cloudMode ? 'true' : 'false');
  dirty = true;
}
function setCloudMode(m) {
  if (m === 'living' && GLC.ok === false) return;
  if (m === 'living' && gpuSlow) livingForced = true;     // chosen again after a slow-device switch: respect it from now on
  cloudPref = m; persist(); applyCloudMode();
}
for (const b of cloudBtns) b.onclick = () => setCloudMode(b.dataset.cloud);
let toastTimer = 0;
function showToast(msg, link) {
  const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
  const deck = document.getElementById('deck'); el.style.bottom = deck.hidden ? '' : (innerHeight - deck.getBoundingClientRect().top + 12) + 'px';
  if (link) { const inp = document.createElement('input'); inp.id = 'toastLink'; inp.readOnly = true; inp.value = link; el.append(inp); inp.focus(); inp.select(); }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, link ? 20000 : 9000);
}
function copyLink() {
  // inside the claude.ai viewer the page sits in a frame with an internal address, so links point at the
  // artifact; anywhere else (GitHub Pages, a local file) they point at the page's own address
  let framed = true; try { framed = window.top !== window.self; } catch (e) { }
  const link = (framed ? ARTIFACT_URL : location.href.split('#')[0]) + '#' + linkToken();
  const done = () => showToast('Link copied. It opens this world, style, zoom and spot, with the same settings.');
  const fail = () => showToast('Copy this link to share this exact view:', link);
  try { navigator.clipboard.writeText(link).then(done, fail); } catch (e) { fail(); }
}
document.getElementById('copyLink').onclick = copyLink;
// a link opened while the page is already showing (when the viewer passes the change on)
window.addEventListener('hashchange', () => {
  const o = parseLink(location.hash); if (!o || location.hash.slice(1) === lastToken) return;
  if (o.seedText.trim() !== seedText) setSeed(o.seedText, false);
  setStyle(o.styleIdx); zoom = o.zoom; document.getElementById('zoomVal').textContent = zoom + '×';
  cam.x = o.cam.x; cam.y = o.cam.y; vel.x = vel.y = 0;
  if (o.voySpeed) setVoySpeed(o.voySpeed); if (typeof o.voyaging === 'boolean') setVoyage(o.voyaging);
  if (typeof o.moversOn === 'boolean') setMovers(o.moversOn); if (o.cloudPref) { cloudPref = o.cloudPref; persist(); applyCloudMode(); }
  if (typeof o.uiHidden === 'boolean') setUiHidden(o.uiHidden);
  visSet = new Set(); dirty = true;
});
function drawCloudLayer(V, T) { if (cloudMode === 'simple') drawClouds(V, T); else if (cloudMode === 'living') drawGLClouds(V, T); }
const seedEl = document.getElementById('seed');
seedEl.addEventListener('keydown', e => { if (e.key === 'Enter') { setSeed(seedEl.value, true); seedEl.blur(); } e.stopPropagation(); });
seedEl.addEventListener('change', () => { if (seedEl.value.trim() !== seedText) setSeed(seedEl.value, true); });
document.getElementById('newWorld').onclick = () => {
  const a = ["iron", "salt", "amber", "heather", "raven", "silver", "thistle", "ember", "tidal", "moss", "frost", "copper"], b = ["vale", "reach", "isles", "march", "coast", "fells", "deep", "firth", "holm", "shire"];
  const cap = w => w[0].toUpperCase() + w.slice(1);
  setSeed(cap(a[Math.floor(Math.random() * a.length)]) + ' ' + cap(b[Math.floor(Math.random() * b.length)]), true);
};
window.addEventListener('keydown', e => {
  if (e.target === seedEl) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser and system shortcuts (Cmd-1, Ctrl-+ ...) alone
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) { keys.add(k); e.preventDefault(); }
  else if (k === '+' || k === '=') { wheelLock = 0; zoomAt(1); }
  else if (k === '-' || k === '_') { wheelLock = 0; zoomAt(-1); }
  else if (k >= '1' && k <= '5') setStyle(+k - 1);
  else if (k === 'v') setVoyage(!voyaging);
  else if (k === 'l') copyLink();
  else if (k === 'h') setUiHidden(!uiHidden, document.activeElement === hideBtn || document.activeElement === showBtn);
  else if (k === '[') stepVoyage(-1);
  else if (k === ']') stepVoyage(1);
  else if (k === 'a') setMovers(!moversOn);
  else if (k === 'c' && STYLES[styleIdx].id === 'orbital') {
    const avail = CLOUD_MODES.filter(m => m !== 'living' || GLC.ok !== false);
    setCloudMode(avail[(avail.indexOf(cloudMode) + 1) % avail.length]);
  }
});
window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys.delete(k); });
window.addEventListener('blur', () => keys.clear());
window.addEventListener('resize', resize);

/* ---------- boot ---------- */
resize();
document.getElementById('zoomVal').textContent = zoom + '×';
setSeed(seedText, !(init && init.cam));
if (init && init.cam) { cam.x = init.cam.x; cam.y = init.cam.y; }
setStyle(styleIdx);
setMovers(moversOn);
applyCloudMode();
setVoySpeed(voySpeed);
setUiHidden(uiHidden);
setVoyage(voyagingAtStart);
linkCam.x = cam.x; linkCam.y = cam.y; updateLink();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { knockCache = new Map(); dirty = true; });
requestAnimationFrame(frame);
</script>
