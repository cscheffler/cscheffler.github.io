<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck — what predicts fellowship success?</title>
<style>
  :root{ --bg:#fbfaf8; --muted:#6b6862; --line:#e2ded7; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#16150f; --muted:#a09a8e; --line:#33312a; } }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;display:none;overflow:hidden}
  .slide.on{display:flex;justify-content:center}
  /* Laid out larger than the viewport and scaled down, so more of a long page fits on screen.
     Column widgets get a fixed logical width so the scaled column fills the frame instead of
     sitting between two wide margins; full-bleed slides take the whole viewport. */
  .slide iframe{
    border:0;display:block;
    width:var(--w);
    height:calc(100% / var(--z));
    transform:scale(var(--z));
    transform-origin:top center;
  }
  #counter{
    position:fixed;right:14px;bottom:10px;z-index:10;
    font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--muted);opacity:.55;font-variant-numeric:tabular-nums;
    background:var(--bg);padding:4px 7px;border-radius:5px;border:1px solid var(--line);
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="counter"></div>

<script>
/* ===========================================================================
   THE DECK — edit this list to re-sequence the talk.

   src    : widget file. Add a #fragment to choose the state the slide opens in.
            The same widget may appear more than once with different fragments;
            each gets its own frame, so they are independent.
   zoom   : optional, default 1. Below 1 fits more of a long page on screen.
   scroll : optional, pixels to scroll the widget down to on arrival. Use it to open
            on the part you want to talk about; you can still scroll by hand for
            a follow-up question.
   fill   : optional. true for slide-shaped pages that should use the whole viewport
            width (the title and W0). Omit for the document-shaped widgets, which are
            given a fixed column so the scaled page fills the frame.

   PageDown / PageUp move between slides, including while a widget has focus.
   Add #3 to this page's own URL to open partway through the deck.
   =========================================================================== */
const DECK = [
  { src: "deck-title.html",                                  fill: true },
  { src: "w0-what-we-measure.html",                          fill: true },
  { src: "w4-yes-no-cost.html#m=B&n=150&c=6&l=2&s=7",        zoom: 1.25, scroll: 0 },
  { src: "w1-events-capacity.html#n=150&p=80&e=15&k=6&a=1",  zoom: 1.25, scroll: 0 },
  { src: "w1-events-capacity.html#n=150&p=80&e=15&k=6&a=1",  zoom: 1.25, scroll: 750 },
  { src: "w0-what-we-measure.html",                          fill: true },
  { src: "deck-thanks.html",                                 fill: true },
  { src: "w7-matched-comparison.html#n=150&e=10&p=0.20.40.40&c=6.29.33.32",              zoom: 1.25, scroll: 0 },
  { src: "w2-disappearing-slope.html#r=5&s=11",              zoom: 1.25, scroll: 0 },
  { src: "w2-disappearing-slope.html#r=20&s=11",             zoom: 1.25, scroll: 0 },
];

const COLUMN_W = 1000;   // logical width for the document-shaped widgets

const stage = document.getElementById("stage");
const counter = document.getElementById("counter");

const frames = [];
DECK.forEach(s => {
  const z = s.zoom || 1;
  const d = document.createElement("div");
  d.className = "slide";
  d.style.setProperty("--z", z);
  d.style.setProperty("--w", s.fill ? "calc(100% / " + z + ")" : COLUMN_W + "px");
  const f = document.createElement("iframe");
  f.src = s.src;
  f.setAttribute("scrolling", "auto");
  // Same origin under the local server, so the deck can place the page where it should open.
  f.addEventListener("load", () => place(f, s));
  d.appendChild(f);
  stage.appendChild(d);
  frames.push(f);
});

function place(f, s){
  if (!s.scroll) return;
  try { f.contentWindow.scrollTo(0, s.scroll); } catch (err) { /* not same origin */ }
}

const slides = [...stage.children];
let cur = 0;

function go(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((el, n) => el.classList.toggle("on", n === cur));
  counter.textContent = (cur + 1) + " / " + slides.length;
  place(frames[cur], DECK[cur]);
  // Put focus back on the deck so the keys keep working without a click.
  window.focus();
}

function nav(key){
  if (key === "PageDown") go(cur + 1);
  else if (key === "PageUp") go(cur - 1);
}

addEventListener("keydown", e => {
  if (e.key === "PageDown" || e.key === "PageUp"){
    e.preventDefault();
    nav(e.key);
  }
});

// Keys pressed while a widget has focus arrive here instead.
addEventListener("message", e => {
  if (e.data && e.data.deck) nav(e.data.deck);
});

const start = parseInt(location.hash.slice(1), 10);
go(Number.isFinite(start) ? start - 1 : 0);
</script>
</body>
</html>
