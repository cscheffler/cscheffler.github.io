<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What predicts fellowship success?</title>
<style>
  :root{
    --bg:#fbfaf8; --panel:#ffffff; --ink:#1c1b19; --muted:#6b6862; --line:#e2ded7;
    --accent:#b45309; --accent-soft:#fdf0dd; --dim:#d8d4cc; --good:#3f6212;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16150f; --panel:#1f1e17; --ink:#f0ede6; --muted:#a09a8e; --line:#33312a;
      --accent:#f0a03c; --accent-soft:#2e2313; --dim:#3a3831; --good:#a3c063;
    }
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;
    justify-content:center;padding:6vmin;box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .card{max-width:900px}
  h1{font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.08;margin:0 0 1.1rem;letter-spacing:-.02em}
  .sub{font-size:clamp(1.2rem,2.5vw,1.75rem);color:var(--muted);margin:0 0 2.6rem;max-width:34ch;line-height:1.45}
  .rule{width:64px;height:3px;background:var(--accent);border-radius:2px;margin:0 0 1.6rem}
  .who{font-size:clamp(.95rem,1.5vw,1.1rem);margin:0}
  .who span{color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <h1>What predicts fellowship success?</h1>
    <p class="sub">a cross-programme study</p>
    <div class="rule"></div>
    <p class="who">Carl Scheffler <span>&nbsp;·&nbsp; GenStream</span></p>
  </div>
<script>
// Presentation runner: forward slide keys to the parent deck. Inert when opened on its own.
if (window.parent !== window){
  addEventListener("keydown", e => {
    if (e.key === "PageDown" || e.key === "PageUp"){
      e.preventDefault();
      parent.postMessage({deck: e.key}, "*");
    }
  });
}
</script>
</body>
</html>
